<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Weekly Lesson Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Libre+Franklin:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================= TOKENS ============================= */
:root{
  --paper:#F5F1E7;
  --paper-dim:#ECE4D3;
  --paper-card:#FFFDF9;
  --ink:#232C33;
  --ink-soft:#5B6670;
  --ink-faint:#8A9199;
  --line:#DCD3BE;
  --line-soft:#E7E0CF;
  --forest:#31513B;
  --forest-light:#4C7458;
  --forest-wash:#E4EBE3;
  --gold:#9C7A2E;
  --gold-wash:#F1E7CE;
  --brick:#93463A;
  --brick-wash:#F1DFD9;
  --slate:#3D5670;
  --slate-wash:#E3E9EE;
  --teal:#2C6E6B;
  --teal-wash:#DDEBEA;
  --navy:#2E4B6B;
  --navy-wash:#DCE4EC;
  --plum:#6B4468;
  --plum-wash:#ECE0EA;
  --rust:#B15C2E;
  --rust-wash:#F3E4D6;
  --olive:#6E6B2E;
  --olive-wash:#EDEBD9;
  --clay:#A85A3E;
  --clay-wash:#F1E1D8;
  --berry:#7A3B54;
  --berry-wash:#EEE0E6;
  --sidebar-bg:#20272C;
  --sidebar-ink:#C9CFC9;
  --sidebar-active:#31513B;
  --shadow:0 1px 2px rgba(35,44,51,0.06), 0 4px 14px rgba(35,44,51,0.06);
  --radius:10px;
  --field:#fff;            /* input backgrounds */
  --fixed-row:#F1ECDF;     /* break/lunch rows in the timetable */
  --on-accent:#fff;        /* text on accent-coloured buttons */
  --inverse-bg:var(--ink); /* active class tab, toast */
  --inverse-ink:#fff;
  --chip-line:#E4D3A4;
  --chip-holiday-line:#DDBBB2;
  --font-display:'Fraunces', Georgia, serif;
  --font-body:'Libre Franklin', -apple-system, BlinkMacSystemFont, sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-body);
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--gold-wash);}
button{font-family:inherit;}
textarea, input{font-family:inherit;}
a{color:inherit;}

/* focus visibility */
button:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible{
  outline:2px solid var(--forest-light);
  outline-offset:2px;
}

/* ============================= LAYOUT ============================= */
#app{
  display:block;
  min-height:100vh;
}
.sidebar{
  width:224px;
  flex-shrink:0;
  background:var(--sidebar-bg);
  color:var(--sidebar-ink);
  display:flex;
  flex-direction:column;
  padding:22px 14px;
  position:fixed;
  left:0;
  top:0;
  height:100vh;
  z-index:30;
  transition:transform .28s ease;
}
body.nav-hidden .sidebar{ transform:translateX(-100%); }
.nav-reveal{
  position:fixed;
  left:14px;
  top:14px;
  z-index:31;
  width:38px;height:38px;
  border-radius:9px;
  border:1px solid var(--line);
  background:var(--paper-card);
  box-shadow:var(--shadow);
  display:none;
  align-items:center;justify-content:center;
  cursor:pointer;
}
.nav-reveal svg{width:17px;height:17px;color:var(--ink);}
body.nav-hidden .nav-reveal{display:flex;}
.sidebar-brand{
  font-family:var(--font-display);
  font-size:19px;
  color:#F2EEE3;
  padding:2px 10px 4px;
  line-height:1.25;
}
.sidebar-sub{
  font-size:11.5px;
  color:#8B958E;
  padding:0 10px 22px;
  letter-spacing:.01em;
}
.nav-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 10px;
  border-radius:8px;
  cursor:pointer;
  font-size:14.5px;
  color:var(--sidebar-ink);
  margin-bottom:2px;
  border:none;
  background:none;
  width:100%;
  text-align:left;
}
.nav-item svg{width:17px;height:17px;flex-shrink:0;opacity:.85;}
.nav-item:hover{background:rgba(255,255,255,0.06);}
.nav-item.active{background:var(--sidebar-active);color:#fff;}
.nav-item.active svg{opacity:1;}
.sidebar-foot{
  margin-top:auto;
  padding:10px;
  font-size:11.5px;
  color:#75807A;
  line-height:1.5;
}

.main{
  margin-left:224px;
  padding:34px 40px 80px;
  max-width:1180px;
  transition:margin-left .28s ease;
}
body.nav-hidden .main{ margin-left:0; }
.page-head{
  margin-bottom:26px;
}
.page-eyebrow{
  font-size:13px;
  color:var(--ink-soft);
  margin:0 0 2px;
}
.page-title{
  font-family:var(--font-display);
  font-size:30px;
  font-weight:500;
  margin:0;
  color:var(--ink);
}

/* mobile: sidebar becomes a top scroll bar */
@media (max-width:860px){
  #app{}
  .sidebar{
    width:100%;
    height:58px;
    position:sticky;
    top:0; left:0;
    z-index:30;
    display:flex;
    flex-direction:row;
    align-items:center;
    padding:0 10px;
    overflow:hidden;
    transform:none !important; /* never auto-hide on mobile — avoids fighting with the browser's own collapsing address bar */
  }
  .nav-reveal{display:none !important;}
  .sidebar-brand,.sidebar-sub,.sidebar-foot{display:none;}
  #nav-items{
    display:flex;
    flex-direction:row;
    align-items:center;
    gap:2px;
    overflow-x:auto;
    height:100%;
    flex:1;
    min-width:0;
  }
  .nav-item{width:auto;white-space:nowrap;flex-shrink:0;}
  .main{margin-left:0;margin-top:0;padding:20px 16px 70px;}
  .page-title{font-size:24px;}
}

/* ============================= COMMON UI ============================= */
.card{
  background:var(--paper-card);
  border:1px solid var(--line-soft);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.btn{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:8px 14px;
  border-radius:8px;
  border:1px solid var(--line);
  background:var(--paper-card);
  color:var(--ink);
  font-size:13.5px;
  font-weight:500;
  cursor:pointer;
}
.btn:hover{border-color:var(--ink-faint);}
.btn-primary{
  background:var(--forest);
  border-color:var(--forest);
  color:var(--on-accent);
}
.btn-primary:hover{background:var(--forest-light);border-color:var(--forest-light);}
.btn-ghost{background:transparent;border-color:transparent;}
.btn-ghost:hover{background:var(--paper-dim);}
.btn-danger{color:var(--brick);}
.btn-sm{padding:5px 10px;font-size:12.5px;}
.icon-btn{
  width:32px;height:32px;
  display:inline-flex;align-items:center;justify-content:center;
  border-radius:7px;border:1px solid var(--line);background:var(--paper-card);cursor:pointer;
}
.icon-btn svg{width:15px;height:15px;}
.icon-btn:hover{border-color:var(--ink-faint);}

textarea, .input{
  width:100%;
  border:1px solid var(--line);
  border-radius:8px;
  padding:9px 11px;
  font-size:14px;
  color:var(--ink);
  background:var(--field);
  resize:vertical;
  line-height:1.5;
}
textarea:focus, .input:focus{border-color:var(--forest-light);}
label.field-label{
  font-size:12px;
  font-weight:600;
  color:var(--ink-soft);
  text-transform:uppercase;
  letter-spacing:.04em;
  margin-bottom:5px;
  display:block;
}

.pill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  font-size:11.5px;
  font-weight:600;
  padding:3px 9px;
  border-radius:20px;
  line-height:1.6;
  white-space:nowrap;
}
.pill-forest{background:var(--forest-wash);color:var(--forest);}
.pill-gold{background:var(--gold-wash);color:var(--gold);}
.pill-brick{background:var(--brick-wash);color:var(--brick);}
.pill-slate{background:var(--slate-wash);color:var(--slate);}
.pill-teal{background:var(--teal-wash);color:var(--teal);}
.pill-navy{background:var(--navy-wash);color:var(--navy);}
.pill-plum{background:var(--plum-wash);color:var(--plum);}
.pill-rust{background:var(--rust-wash);color:var(--rust);}
.pill-olive{background:var(--olive-wash);color:var(--olive);}
.pill-clay{background:var(--clay-wash);color:var(--clay);}
.pill-berry{background:var(--berry-wash);color:var(--berry);}
.pill-muted{background:var(--paper-dim);color:var(--ink-soft);}

/* class colour-coding: a soft wash background + solid left accent bar,
   used on timetable cells / period rows / plan tabs so each class reads
   at a glance without needing to read the label. */
.cc-forest{background:var(--forest-wash);border-left:3px solid var(--forest);}
.cc-gold{background:var(--gold-wash);border-left:3px solid var(--gold);}
.cc-brick{background:var(--brick-wash);border-left:3px solid var(--brick);}
.cc-slate{background:var(--slate-wash);border-left:3px solid var(--slate);}
.cc-teal{background:var(--teal-wash);border-left:3px solid var(--teal);}
.cc-navy{background:var(--navy-wash);border-left:3px solid var(--navy);}
.cc-plum{background:var(--plum-wash);border-left:3px solid var(--plum);}
.cc-rust{background:var(--rust-wash);border-left:3px solid var(--rust);}
.cc-olive{background:var(--olive-wash);border-left:3px solid var(--olive);}
.cc-clay{background:var(--clay-wash);border-left:3px solid var(--clay);}
.cc-berry{background:var(--berry-wash);border-left:3px solid var(--berry);}
.cc-dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-right:6px;}
.cc-dot.cc-forest{background:var(--forest);border-left:none;}
.cc-dot.cc-gold{background:var(--gold);border-left:none;}
.cc-dot.cc-brick{background:var(--brick);border-left:none;}
.cc-dot.cc-slate{background:var(--slate);border-left:none;}
.cc-dot.cc-teal{background:var(--teal);border-left:none;}
.cc-dot.cc-navy{background:var(--navy);border-left:none;}
.cc-dot.cc-plum{background:var(--plum);border-left:none;}
.cc-dot.cc-rust{background:var(--rust);border-left:none;}
.cc-dot.cc-olive{background:var(--olive);border-left:none;}
.cc-dot.cc-clay{background:var(--clay);border-left:none;}
.cc-dot.cc-berry{background:var(--berry);border-left:none;}
.tt-cc-forest{border-left:4px solid var(--forest);}
.tt-cc-gold{border-left:4px solid var(--gold);}
.tt-cc-brick{border-left:4px solid var(--brick);}
.tt-cc-slate{border-left:4px solid var(--slate);}
.tt-cc-teal{border-left:4px solid var(--teal);}
.tt-cc-navy{border-left:4px solid var(--navy);}
.tt-cc-plum{border-left:4px solid var(--plum);}
.tt-cc-rust{border-left:4px solid var(--rust);}
.tt-cc-olive{border-left:4px solid var(--olive);}
.tt-cc-clay{border-left:4px solid var(--clay);}
.tt-cc-berry{border-left:4px solid var(--berry);}

.empty-note{
  color:var(--ink-faint);
  font-size:13.5px;
  font-style:italic;
}

/* ============================= DASHBOARD ============================= */
.dash-grid{
  display:grid;
  grid-template-columns:1.6fr 1fr;
  gap:20px;
}
@media (max-width:940px){.dash-grid{grid-template-columns:1fr;}}

.today-strip{
  display:flex;justify-content:space-between;align-items:baseline;
  margin-bottom:16px;flex-wrap:wrap;gap:8px;
}
.today-date{font-family:var(--font-display);font-size:20px;}
.period-row{
  display:flex;
  gap:14px;
  padding:14px 4px;
  border-bottom:1px solid var(--line-soft);
  align-items:flex-start;
}
.period-row:last-child{border-bottom:none;}
.period-time{
  width:76px;flex-shrink:0;font-size:12px;color:var(--ink-soft);padding-top:2px;
}
.period-time strong{display:block;font-size:13px;color:var(--ink);font-weight:600;}
.period-main{flex:1;min-width:0;}
.period-class-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px;}
.period-class-name{font-weight:600;font-size:14.5px;}
.period-room{font-size:12.5px;color:var(--ink-soft);}
.period-fixed{
  padding:8px 4px;
  color:var(--ink-faint);
  font-size:12.5px;
  border-bottom:1px solid var(--line-soft);
  display:flex;gap:14px;
}
.period-fixed .period-time{width:76px;flex-shrink:0;}
.lesson-preview{
  font-size:13px;color:var(--ink-soft);
  cursor:pointer;
  padding:6px 9px;
  background:var(--paper-dim);
  border-radius:6px;
  margin-top:2px;
}
.lesson-preview:hover{background:var(--line-soft);}
.lesson-preview.empty{color:var(--ink-faint);font-style:italic;}

.side-card{padding:18px;margin-bottom:18px;}
.side-card h3{
  font-family:var(--font-display);font-weight:500;font-size:16px;margin:0 0 12px;
}
.mini-event{
  font-size:13px;padding:7px 0;border-bottom:1px solid var(--line-soft);
  display:flex;gap:8px;align-items:flex-start;
}
.mini-event:last-child{border-bottom:none;}

.retirement-card{background:var(--forest);color:#fff;border-color:var(--forest);}
.retirement-card h3{color:#fff;}
.retirement-stats{display:flex;gap:10px;}
.retirement-stat{flex:1;text-align:center;background:rgba(255,255,255,0.08);border-radius:8px;padding:10px 4px;}
.retirement-stat .num{display:block;font-family:var(--font-display);font-size:26px;line-height:1.1;}
.retirement-stat .lbl{display:block;font-size:10.5px;color:#D7E0D8;margin-top:3px;text-transform:uppercase;letter-spacing:.03em;}
.retirement-card .empty-note{color:#C3CFC4;}

/* ============================= THEMES ============================= */
:root[data-theme="ocean"]{
  --paper:#EEF2F4;--paper-dim:#E0E7EB;--paper-card:#FBFCFD;--line:#C9D4DB;--line-soft:#DCE4E9;
  --ink:#1F2B35;--ink-soft:#52626F;--ink-faint:#83919C;
  --forest:#2D5F7F;--forest-light:#3F7698;--forest-wash:#DFEAF1;--gold-wash:#E6EEF3;
  --sidebar-bg:#18242E;--sidebar-active:#2D5F7F;--fixed-row:#E6ECEF;--chip-line:#C3D3DD;
}
:root[data-theme="heather"]{
  --paper:#F4EFF1;--paper-dim:#EAE1E5;--paper-card:#FDFBFC;--line:#D9CBD1;--line-soft:#E7DDE1;
  --ink:#2E2530;--ink-soft:#655A66;--ink-faint:#958A95;
  --forest:#6B4468;--forest-light:#82587F;--forest-wash:#EEE3EC;--gold-wash:#F2E9EE;
  --sidebar-bg:#271E27;--sidebar-active:#6B4468;--fixed-row:#EDE5E8;--chip-line:#DCC8D3;
}
:root[data-theme="clean"]{
  --paper:#F4F5F6;--paper-dim:#E9EBED;--paper-card:#FFFFFF;--line:#D3D7DB;--line-soft:#E4E7EA;
  --ink:#1E2328;--ink-soft:#575F67;--ink-faint:#8A9198;
  --forest:#1F6E68;--forest-light:#2A857E;--forest-wash:#DDEEEC;--gold-wash:#EEF1F2;
  --sidebar-bg:#FFFFFF;--sidebar-ink:#3B434A;--sidebar-active:#1F6E68;--fixed-row:#EEF0F2;--chip-line:#D3DCDF;
}
:root[data-theme="clean"] .sidebar{border-right:1px solid var(--line-soft);}
:root[data-theme="clean"] .sidebar-brand{color:var(--ink);}
:root[data-theme="clean"] .sidebar-sub, :root[data-theme="clean"] .sidebar-foot{color:var(--ink-faint);}
:root[data-theme="clean"] .nav-item:hover{background:var(--paper-dim);}
@media (max-width:860px){:root[data-theme="clean"] .sidebar{border-right:none;border-bottom:1px solid var(--line-soft);}}
:root[data-theme="night"]{
  color-scheme:dark;
  --paper:#171C20;--paper-dim:#21282D;--paper-card:#1D2328;--line:#343D44;--line-soft:#2A3238;
  --ink:#E4E7E2;--ink-soft:#A8B0B6;--ink-faint:#79838A;
  --forest:#4F8462;--forest-light:#6AA07D;--forest-wash:#22332A;
  --gold:#D3B26A;--gold-wash:#352E1E;--brick:#DB8C7E;--brick-wash:#3A2522;
  --slate:#94AECB;--slate-wash:#232D38;--teal:#7CC2BD;--teal-wash:#1E3332;
  --navy:#8FAED0;--navy-wash:#212C39;--plum:#C79BC3;--plum-wash:#33243A;
  --rust:#E19A6E;--rust-wash:#3A2A1F;--olive:#C2BE78;--olive-wash:#2F2E1E;
  --clay:#DC9A81;--clay-wash:#382821;--berry:#D092AB;--berry-wash:#36222C;
  --sidebar-bg:#101417;--sidebar-active:#4F8462;
  --field:#161B1F;--fixed-row:#1A2025;--inverse-bg:#E4E7E2;--inverse-ink:#171C20;
  --chip-line:#4A4130;--chip-holiday-line:#5A3A35;
  --shadow:0 1px 2px rgba(0,0,0,0.3), 0 4px 14px rgba(0,0,0,0.25);
}
.theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
.theme-opt{display:flex;flex-direction:column;gap:8px;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--paper-card);cursor:pointer;text-align:left;font:inherit;color:var(--ink);}
.theme-opt:hover{border-color:var(--ink-faint);}
.theme-opt[aria-pressed="true"]{border-color:var(--forest);box-shadow:0 0 0 2px var(--forest-wash);}
.theme-swatch{display:flex;height:34px;border-radius:6px;overflow:hidden;border:1px solid rgba(0,0,0,0.08);}
.theme-swatch span{flex:1;}
.theme-swatch span:first-child{flex:0 0 30%;}
.theme-name{font-size:13px;font-weight:600;}

/* ============================= CLASSES ============================= */
.cls-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper-card);}
.seg button{border:none;background:transparent;padding:6px 12px;font:inherit;font-size:12.5px;color:var(--ink-soft);cursor:pointer;}
.seg button + button{border-left:1px solid var(--line);}
.seg button[aria-pressed="true"]{background:var(--forest);color:var(--on-accent);}
.cls-summary{font-size:13px;color:var(--ink-soft);}
.cls-group{margin-bottom:22px;}
.cls-group h2{font-family:var(--font-display);font-weight:500;font-size:18px;margin:0 0 10px;}
.cls-week{font-size:12px;font-weight:600;color:var(--ink-soft);margin:14px 0 6px;}
.cls-lesson{display:flex;gap:14px;padding:12px 14px;border:1px solid var(--line-soft);border-left-width:4px;border-radius:8px;background:var(--paper-card);margin-bottom:8px;cursor:pointer;text-align:left;width:100%;font:inherit;color:var(--ink);}
.cls-lesson:hover{border-color:var(--ink-faint);}
.cls-lesson.is-today{box-shadow:0 0 0 2px var(--gold-wash);}
.cls-when{width:112px;flex-shrink:0;font-size:12px;color:var(--ink-soft);line-height:1.45;}
.cls-when strong{display:block;font-size:13.5px;color:var(--ink);}
.cls-body{flex:1;min-width:0;}
.cls-title{font-weight:600;font-size:14px;margin-bottom:2px;}
.cls-title.empty{font-weight:400;font-style:italic;color:var(--ink-faint);}
.cls-notes{font-size:12.5px;color:var(--ink-soft);white-space:pre-line;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.cls-hw{font-size:12px;color:var(--forest);margin-top:4px;}
@media (max-width:600px){.cls-lesson{flex-direction:column;gap:6px;}.cls-when{width:auto;}}

/* ============================= HOMEWORK TIMETABLE ============================= */
.tt-grid.hw-grid{grid-template-columns:150px repeat(5, minmax(130px,1fr));}
@media (max-width:860px){.tt-grid.hw-grid{grid-template-columns:110px repeat(5, minmax(140px,1fr));min-width:810px;}}
.hw-cell{font-size:12.5px;line-height:1.4;white-space:pre-line;}
.hw-cell.empty{color:var(--ink-faint);}
.hw-class-cell{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink);background:var(--paper-dim);}
.hw-slot{display:flex;flex-direction:column;gap:5px;}
.hw-slot.hw-done{background:var(--forest-wash);}
.hw-slot-label{font-size:11.5px;font-weight:600;color:var(--ink-soft);}
.hw-slot textarea.hw-content{min-height:48px;font-size:12.5px;padding:5px 7px;line-height:1.4;}
.hw-tick{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink);cursor:pointer;}
.hw-tick input{width:15px;height:15px;margin:0;accent-color:var(--forest);cursor:pointer;}
.hw-off{background:var(--fixed-row);}
.hw-summary{font-size:13px;color:var(--ink-soft);margin:-6px 0 12px;}
.hw-edit textarea{width:100%;min-height:52px;font-size:12.5px;padding:6px 7px;resize:vertical;}

/* ============================= HOMEWORK ON TIMETABLE ============================= */
.tt-hw{display:flex;flex-direction:column;gap:2px;margin-top:3px;padding:3px 6px;border-radius:5px;background:var(--gold-wash);border:1px solid var(--chip-line);}
.tt-hw.done{background:var(--forest-wash);border-color:transparent;}
.tt-hw-label{font-size:10.5px;font-weight:600;color:var(--ink);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.tt-hw-ticks{display:flex;gap:6px;font-size:9.5px;color:var(--ink-faint);}
.tt-hw-ticks span::before{content:"○ ";}
.tt-hw-ticks span.on{color:var(--forest);font-weight:600;}
.tt-hw-ticks span.on::before{content:"✓ ";}

.hw-inline{margin:4px 0 6px;padding:7px 10px;border-radius:7px;background:var(--gold-wash);border:1px solid var(--chip-line);}
.hw-inline.done{background:var(--forest-wash);border-color:transparent;}
.hw-inline-head{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;}
.hw-inline-label{font-size:12.5px;font-weight:600;color:var(--ink);margin-right:auto;}
.hw-inline-text{font-size:12.5px;color:var(--ink-soft);margin-top:3px;}
.hw-inline-content{margin-top:6px;font-size:13px;padding:6px 8px;min-height:44px;}
.daily-body .hw-inline{margin:0 0 12px;}

/* ============================= ACTIVITIES ============================= */
.act-chip{display:block;font-size:12px;line-height:1.35;padding:5px 8px;border-radius:6px;border-left:3px solid;}
.act-chip strong{font-weight:700;}
.act-chip.compact{font-size:11px;padding:3px 6px;}
.act-duty{background:var(--brick-wash);border-color:var(--brick);color:var(--brick);}
.act-commute{background:var(--navy-wash);border-color:var(--navy);color:var(--navy);}
.act-club{background:var(--teal-wash);border-color:var(--teal);color:var(--teal);}
.act-meeting{background:var(--gold-wash);border-color:var(--gold);color:var(--gold);}
.act-other{background:var(--plum-wash);border-color:var(--plum);color:var(--plum);}
.act-editor{display:flex;flex-direction:column;gap:4px;}
.act-editor .input{padding:4px 6px;font-size:11.5px;}
.tt-fixed-cell{background:var(--fixed-row);min-height:30px;padding:5px 6px;}
.period-fixed .act-chip, .daily-fixed .act-chip{margin-top:4px;}
.period-fixed-main{flex:1;min-width:0;}
.after-acts{margin-bottom:6px;}
.todo-sub{font-size:11.5px;font-weight:600;color:var(--ink-faint);margin:6px 0 2px;}
.todo-day{font-size:11px;font-weight:600;color:var(--ink-faint);flex-shrink:0;width:30px;}

/* ============================= TO-DO LISTS ============================= */
.todo-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px;}
.todo-head h3{font-family:var(--font-display);font-weight:500;font-size:16px;margin:0;}
.todo-count{font-size:12px;color:var(--ink-faint);white-space:nowrap;}
.todo-list{list-style:none;margin:0 0 10px;padding:0;}
.todo-item{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--line-soft);}
.todo-item:last-child{border-bottom:none;}
.todo-check{width:17px;height:17px;flex-shrink:0;accent-color:var(--forest);cursor:pointer;margin:0;}
.todo-text{flex:1;min-width:0;border:1px solid transparent;background:transparent;border-radius:6px;padding:5px 6px;font:inherit;font-size:13.5px;color:var(--ink);}
.todo-text:hover{border-color:var(--line-soft);}
.todo-text:focus{border-color:var(--forest-light);background:var(--field);outline:none;}
.todo-item.done .todo-text{text-decoration:line-through;color:var(--ink-faint);}
.todo-del{flex-shrink:0;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;border:none;background:transparent;border-radius:6px;color:var(--ink-faint);cursor:pointer;}
.todo-del svg{width:13px;height:13px;}
.todo-del:hover,.todo-del:focus-visible{background:var(--brick-wash);color:var(--brick);}
.todo-add{display:flex;gap:6px;}
.todo-add .input{padding:7px 10px;font-size:13.5px;}
.todo-actions{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;}
.todo-actions button{border:none;background:none;padding:2px 0;font-size:12px;color:var(--ink-soft);cursor:pointer;text-decoration:underline;text-underline-offset:2px;}
.todo-actions button:hover{color:var(--ink);}
.todo-card-wide{padding:18px 22px;margin-top:20px;max-width:620px;}
.todo-card-daily{padding:18px 22px;margin-bottom:18px;}

/* ============================= TIMETABLE GRID ============================= */
.week-nav{
  display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap;
}
.week-nav .range{font-family:var(--font-display);font-size:17px;}

.tt-grid{
  display:grid;
  grid-template-columns:92px repeat(5, 1fr);
  border:1px solid var(--line-soft);
  border-radius:var(--radius);
  overflow:hidden;
  background:var(--paper-card);
}
.tt-cell{
  border-bottom:1px solid var(--line-soft);
  border-right:1px solid var(--line-soft);
  padding:9px 8px;
  min-height:58px;
}
.tt-grid > .tt-cell:nth-child(6n){border-right:none;}
/* Weekly grid: doubles span two rows, so cells can't be counted; every cell keeps its right border instead */
.tt-grid.wk-grid{border-right:none;}
.tt-grid.wk-grid > .tt-cell{border-right:1px solid var(--line-soft);}
.tt-head{
  background:var(--paper-dim);
  font-size:12px;font-weight:600;
  display:flex;flex-direction:column;justify-content:center;
  min-height:auto;
  padding:10px 8px;
}
.tt-head .dow{font-size:13px;}
.tt-head .ddate{font-size:11px;color:var(--ink-soft);font-weight:500;}
.tt-time-cell{
  background:var(--paper-dim);
  font-size:11px;color:var(--ink-soft);
  display:flex;flex-direction:column;justify-content:center;
}
.tt-time-cell strong{font-size:12px;color:var(--ink);}
.tt-fixed-row .tt-cell{min-height:26px;background:var(--fixed-row);color:var(--ink-faint);font-size:11px;display:flex;align-items:center;}
.tt-lesson-cell{
  cursor:pointer;
  display:flex;flex-direction:column;gap:2px;
}
.tt-lesson-cell:hover{background:var(--forest-wash);}
.tt-lesson-cell .cname{font-size:12.5px;font-weight:600;line-height:1.25;}
.tt-lesson-cell .croom{font-size:11px;color:var(--ink-soft);}
.tt-lesson-cell .cnote{font-size:10.5px;color:var(--forest);margin-top:2px;}
.tt-lesson-cell.empty{color:var(--ink-faint);font-size:11.5px;font-style:italic;}
.tt-lesson-cell.today-col{background:var(--gold-wash);}
.agenda-chip{
  background:var(--gold-wash);
  border:1px solid var(--chip-line);
  border-radius:7px;
  padding:6px 8px;
  margin-bottom:6px;
}
.agenda-chip .agenda-title{font-size:10.5px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.03em;display:block;margin-bottom:3px;}
.agenda-chip ul{margin:0;padding-left:14px;font-size:11px;line-height:1.55;color:var(--ink-soft);}
.agenda-chip.agenda-holiday{background:var(--brick-wash);border-color:var(--chip-holiday-line);}
.agenda-chip.agenda-holiday .agenda-title{color:var(--brick);}
.daily-agenda .agenda-title{font-size:11.5px;}
.daily-agenda ul{font-size:12.5px;}
.tt-double-joined{border-top:none !important;}

.tt-edit-row .tt-cell input{
  width:100%;border:1px solid var(--line);border-radius:5px;padding:4px 5px;font-size:11px;margin-bottom:3px;
}

@media (max-width:860px){
  .tt-grid{grid-template-columns:70px repeat(5, minmax(84px,1fr));font-size:11px;overflow-x:auto;}
  .tt-grid{display:grid;}
  .main{overflow-x:hidden;overflow-y:visible;}
}
.tt-scroll{overflow-x:auto;}

/* ============================= DAILY VIEW ============================= */
.day-picker{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
.daily-period{
  display:flex;gap:16px;padding:16px 0;border-bottom:1px solid var(--line-soft);
}
.daily-period:last-child{border-bottom:none;}
.daily-time-col{width:96px;flex-shrink:0;}
.daily-time-col .lbl{font-weight:600;font-size:13.5px;}
.daily-time-col .tm{font-size:11.5px;color:var(--ink-soft);}
.daily-body{flex:1;min-width:0;}
.daily-fixed{padding:10px 0 10px 112px;color:var(--ink-faint);font-size:12.5px;border-bottom:1px solid var(--line-soft);}
.daily-class-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.daily-class-head input.input{padding:6px 9px;font-size:13px;}
.daily-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media (max-width:700px){.daily-fields{grid-template-columns:1fr;}}
.daily-fields .full{grid-column:1/-1;}

/* ============================= MODAL ============================= */
.modal-overlay{
  position:fixed;inset:0;background:rgba(32,39,44,0.45);
  display:flex;align-items:center;justify-content:center;
  z-index:100;padding:20px;
}
.modal{
  background:var(--paper-card);
  border-radius:12px;
  max-width:560px;width:100%;
  max-height:88vh;overflow-y:auto;
  padding:24px 26px 22px;
  box-shadow:0 12px 40px rgba(0,0,0,0.25);
}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;gap:10px;}
.modal-head h3{font-family:var(--font-display);font-size:19px;font-weight:500;margin:0 0 4px;}
.modal-head .sub{font-size:12.5px;color:var(--ink-soft);}
.field-group{margin-bottom:14px;}
.modal-actions{display:flex;justify-content:space-between;margin-top:18px;gap:10px;}

/* ============================= CALENDAR ============================= */
.term-controls{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
.week-card{
  padding:15px 18px;margin-bottom:12px;
}
.week-card.holiday{background:var(--brick-wash);border-color:var(--brick-wash);}
.week-card.current{border-color:var(--forest);box-shadow:0 0 0 2px var(--forest) inset, var(--shadow);}
.week-card-head{display:flex;align-items:baseline;gap:10px;margin-bottom:8px;flex-wrap:wrap;}
.week-card-head .wb{font-weight:600;font-size:14.5px;}
.week-card ul{margin:0;padding-left:18px;font-size:13.5px;line-height:1.7;}
.custom-event-tag{background:var(--gold-wash);color:var(--gold);border-radius:5px;padding:1px 6px;font-weight:600;}
.custom-event-tag a{color:var(--brick);text-decoration:none;font-weight:700;margin-left:2px;}
.custom-event-tag a:hover{text-decoration:underline;}
.week-card.holiday ul, .week-card.holiday .wb{color:var(--brick);}

/* ============================= LONG TERM PLANS ============================= */
.class-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px;}
.class-tab{
  padding:7px 13px;border-radius:20px;border:1px solid var(--line);
  background:var(--paper-card);font-size:13px;font-weight:500;cursor:pointer;
}
.class-tab.active{background:var(--inverse-bg);color:var(--inverse-ink);border-color:var(--inverse-bg);}
.class-tab-wrap{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:20px;background:var(--paper-card);}
.class-tab-wrap .class-tab{border:none;background:transparent;padding-right:4px;color:var(--ink);}
.class-tab-wrap.active{background:var(--inverse-bg);border-color:var(--inverse-bg);}
.class-tab-wrap.active .class-tab, .class-tab-wrap.active .class-tab-del{color:var(--inverse-ink);}
.class-tab-wrap.stale{border-style:dashed;}
.class-tab-wrap.stale .class-tab{color:var(--ink-soft);}
.class-tab-del{width:24px;height:24px;margin-right:4px;display:inline-flex;align-items:center;justify-content:center;border:none;background:transparent;border-radius:50%;color:var(--ink-faint);cursor:pointer;flex-shrink:0;}
.class-tab-del svg{width:11px;height:11px;}
.class-tab-del:hover,.class-tab-del:focus-visible{background:var(--brick-wash);color:var(--brick);}
.hw-class-cell .hw-class-name{flex:1;min-width:0;}
.hw-class-cell .class-tab-del{margin-right:-4px;}
.hw-class-cell.stale .hw-class-name{color:var(--ink-faint);text-decoration:line-through;text-decoration-style:dashed;}
.stale-note{font-size:12.5px;color:var(--ink-soft);margin:-10px 0 16px;}
.link-btn{border:none;background:none;padding:0;font:inherit;color:var(--forest);text-decoration:underline;text-underline-offset:2px;cursor:pointer;}
.restore-list{display:flex;flex-direction:column;gap:8px;}
.restore-item{display:flex;align-items:center;gap:8px;font-size:13.5px;}
.restore-item .btn{margin-left:auto;}
.plan-half{margin-bottom:16px;}
.plan-half .field-label{margin-bottom:6px;}

/* ============================= SETTINGS ============================= */
.settings-block{padding:20px 22px;margin-bottom:18px;}
.settings-block h3{font-family:var(--font-display);font-weight:500;font-size:17px;margin:0 0 6px;}
.settings-block p{font-size:13.5px;color:var(--ink-soft);line-height:1.6;margin:0 0 12px;}
.row-flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}

.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
  background:var(--inverse-bg);color:var(--inverse-ink);padding:9px 18px;border-radius:20px;
  font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,0.25);z-index:200;
  opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

/* ============================= SETUP ============================= */
body.setup-mode .sidebar, body.setup-mode .nav-reveal{display:none;}
body.setup-mode .main{margin-left:0;margin-right:auto;margin-left:auto;max-width:860px;}
.setup-step{margin-bottom:20px;padding:22px 24px;}
.setup-step h3{margin:0 0 4px;font-family:'Fraunces',serif;font-weight:600;font-size:19px;}
.setup-step .step-num{display:inline-block;width:24px;height:24px;border-radius:50%;background:var(--forest);color:#fff;font-size:13px;text-align:center;line-height:24px;margin-right:8px;font-family:'Libre Franklin',sans-serif;}
.setup-step p.hint{margin:0 0 14px;color:var(--ink-soft);font-size:13.5px;line-height:1.5;}
.setup-class-row{display:grid;grid-template-columns:130px 1fr 120px 36px;gap:8px;margin-bottom:8px;align-items:center;}
.setup-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.setup-tab{padding:7px 14px;border-radius:7px;border:1px solid var(--line);background:var(--paper-card);cursor:pointer;font-size:13.5px;font-weight:500;}
.setup-tab.active{background:var(--forest);border-color:var(--forest);color:#fff;}
.setup-slot{display:grid;grid-template-columns:110px 1fr 90px;gap:8px;margin-bottom:8px;align-items:center;}
.setup-slot .lbl{font-size:13.5px;font-weight:600;color:var(--ink-soft);}
.setup-check{display:flex;gap:9px;align-items:flex-start;font-size:14px;margin:10px 0;line-height:1.45;cursor:pointer;}
.setup-check input{margin-top:3px;}
select.input{appearance:auto;}
.setup-actions{display:flex;gap:10px;justify-content:flex-end;align-items:center;flex-wrap:wrap;margin-top:6px;}
.setup-err{color:var(--brick);font-size:13.5px;margin:0 0 8px;}
@media (max-width:860px){
  .setup-class-row{grid-template-columns:1fr 1fr 36px;}
  .setup-class-row .sc-label{grid-column:1 / 3;order:3;}
  .setup-class-row .sc-colour{order:2;}
  .setup-class-row .sc-del{order:2;}
  .setup-slot{grid-template-columns:84px 1fr 70px;}
  .setup-step{padding:18px 16px;}
}

// timetable[weekType][day][periodKey] = {class, room, time (optional override), double (bool)} or null (free)

  B: {
    Mon:{ reg:{class:'11SEA/Tu',room:'M4'},
          p1:{class:'13D/Fm',room:'D2',time:'09:05–10:45',double:true}, p2:{class:'13D/Fm',room:'D2',double:true},
          p3:{class:'11C/Lt',room:'H3'}, p4:{class:'11C/Lt',room:'H3'},
          p5:{class:'12E/Fm',room:'D2',time:'13:40–15:20',double:true}, p6:{class:'12E/Fm',room:'D2',double:true} },
    Tue:{ reg:{class:'11SEA/Tu',room:'M4'},
          p1:null, p2:null, p3:{class:'10s/Ma1',room:'M3'}, p4:{class:'11h/Ma4',room:'M3'}, p5:{class:'10h/Ma1',room:'M3'},
          p6:null },

const STORAGE_KEY = 'plannerData_andyBrooks_v1';

function defaultStore(){

    longTermPlans: {},     // classCode -> {label, colorNote, plan: {ht1..ht6: text}}
    classMeta: {},         // classCode -> {label, color}  (overrides DEFAULT_CLASSES)
    timetableOverrides: {},// weekType -> day -> periodKey -> {class, room} (overrides DEFAULT_TIMETABLE — permanent, e.g. a room correction)
    dailyOverrides: {},    // "YYYY-MM-DD_periodKey" -> {class, room} (one-off, e.g. cover or a single room change)
    customEvents: {},      // "YYYY-MM-DD" -> array of manually-added calendar/meeting notes for that date
    afterSchool: {},       // "YYYY-MM-DD" -> text (After School slot is free-text, not tied to a class)
    homework: {A:{}, B:{}},   // weekType -> classCode -> day -> text (the homework timetable template)
    homeworkWork: {},         // "YYYY-MM-DD_classCode" -> {content, created, smhw} for a real date
    activities: {A:{}, B:{}},  // weekType -> day -> 'break'|'lunch'|'after' -> {type, text}: duties, commutes, clubs…
    hiddenClasses: [],        // class codes removed from the Classes / Homework / Long-Term Plans lists
    theme: 'classic',         // colour theme key, see THEMES
    todos: {week:{}, day:{}}, // week: Monday "YYYY-MM-DD" -> [{id,text,done}], day: "YYYY-MM-DD" -> [{id,text,done}]
    weekAnchor: WEEK_ANCHOR,
    weekAnchorType: WEEK_ANCHOR_TYPE,
    profile: null,         // {setupDone, kind:'andy'|'custom', name, countdown:{enabled,label,date,excludeEarly,cutoff}}
    customTimetable: null, // full A/B grid for teachers who ran setup (null = built-in default timetable)
    lastModified: 0
  };
}
// Data saved before the setup screen existed belongs to the original
// built-in timetable; give it a profile so it keeps working unchanged.
function legacyProfile(){
  return {setupDone:true, kind:'andy', name:'Andy Brooks',
    countdown:{enabled:true, label:'Countdown to retirement', date:RETIREMENT_DATE, excludeEarly:true, cutoff:EARLY_LEAVERS_CUTOFF}};
}
function normalizeStore(obj){
  const st = Object.assign(defaultStore(), obj);
  if(!st.profile) st.profile = legacyProfile();
  if(!st.todos || typeof st.todos!=='object') st.todos = {};
  if(!st.todos.week) st.todos.week = {};
  if(!st.todos.day) st.todos.day = {};
  if(!st.homework || typeof st.homework!=='object') st.homework = {};
  if(!st.homework.A) st.homework.A = {};
  if(!st.homework.B) st.homework.B = {};
  if(!st.homeworkWork || typeof st.homeworkWork!=='object') st.homeworkWork = {};
  if(!st.activities || typeof st.activities!=='object') st.activities = {};
  if(!st.activities.A) st.activities.A = {};
  if(!st.activities.B) st.activities.B = {};
  if(!Array.isArray(st.hiddenClasses)) st.hiddenClasses = [];
  if(!st.theme) st.theme = 'classic';
  return st;
}
function needsSetup(){ return !store.profile || !store.profile.setupDone; }
function baseClasses(){ return (store.profile && store.profile.kind==='custom') ? {} : DEFAULT_CLASSES; }
function baseTimetable(){
  if(store.profile && store.profile.kind==='custom') return store.customTimetable || {A:{},B:{}};
  return DEFAULT_TIMETABLE;
}

let store = loadStore();

function loadStore(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultStore();
    const parsed = JSON.parse(raw);
    return normalizeStore(parsed);
  }catch(e){
    console.error('Could not read saved planner data, starting fresh.', e);
    return defaultStore();
  }
}
function persist(){
  try{
    store.lastModified = Date.now();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
  }catch(e){
    showToast('Could not save — your browser storage may be full.');
  }
  scheduleDriveUpload();
}
// When signed in to Google, push changes to Drive a few seconds after the last edit.
const scheduleDriveUpload = debounce(()=>{
  if(typeof driveSignedIn!=='undefined' && driveSignedIn && !driveBusy && !needsSetup()) driveSyncNow(true);
}, 4000);

/* ======================================================================
   UTILITIES
   ====================================================================== */
function pad(n){ return n<10 ? '0'+n : ''+n; }
function toISO(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function fromISO(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function addDays(d, n){ const nd=new Date(d); nd.setDate(nd.getDate()+n); return nd; }
function getMonday(d){
  const nd = new Date(d);
  const day = nd.getDay(); // 0 Sun .. 6 Sat
  const diff = (day===0? -6 : 1-day);
  nd.setDate(nd.getDate()+diff);
  nd.setHours(0,0,0,0);
  return nd;
}
function fmtLong(d){
  return d.toLocaleDateString('en-GB',{weekday:'long', day:'numeric', month:'long'});
}
function fmtShort(d){
  return d.toLocaleDateString('en-GB',{day:'numeric', month:'short'});
}
function dayKeyOf(d){
  return DAYS[(d.getDay()+6)%7] || null; // null for weekend
}
function weekTypeFor(d){
  // The school calendar is the source of truth: it labels each teaching week
  // A or B and does NOT count holiday weeks, so a plain alternation drifts
  // out of step after half term / Christmas / Easter.
  const mondayISO = toISO(getMonday(d));
  const calWeek = TERM_CALENDAR.find(w=>w.wb===mondayISO);
  if(calWeek && calWeek.type) return calWeek.type;
  // Fallback for dates outside the calendar: simple alternation from the anchor.
  const anchor = getMonday(fromISO(store.weekAnchor));
  const monday = getMonday(d);
  const diffWeeks = Math.round((monday - anchor) / (7*24*3600*1000));
  const isAnchorA = store.weekAnchorType === 'A';
  const isEven = ((diffWeeks % 2) + 2) % 2 === 0;
  const anchorIsThisType = isEven; // even offset => same type as anchor
  if(store.weekAnchorType==='A') return anchorIsThisType ? 'A' : 'B';
  return anchorIsThisType ? 'B' : 'A';
}
function classInfo(code){
  if(!code) return null;
  const override = store.classMeta[code];
  const base = baseClasses()[code] || {label:code, color:'slate'};
  return Object.assign({}, base, override||{});
}
function getSlot(weekType, day, periodKey){
  const override = store.timetableOverrides?.[weekType]?.[day]?.[periodKey];
  if(override !== undefined) return override; // includes explicit null (marked free)
  const v = baseTimetable()?.[weekType]?.[day]?.[periodKey];
  return v === undefined ? null : v;
}
// Layers: a one-off daily override (cover, single room change) > the
// permanent weekly-pattern override > the default timetable.
function getSlotForDate(dateISO, periodKey){
  const dailyOv = store.dailyOverrides[dateISO+'_'+periodKey];
  if(dailyOv !== undefined) return dailyOv; // includes explicit null (marked free just for this date)
  const date = fromISO(dateISO);
  const dKey = dayKeyOf(date);
  if(!dKey) return null;
  return getSlot(weekTypeFor(date), dKey, periodKey);
}
function hasDailyOverride(dateISO, periodKey){
  return store.dailyOverrides[dateISO+'_'+periodKey] !== undefined;
}
function setDailyOverride(dateISO, periodKey, cls, room){
  const key = dateISO+'_'+periodKey;
  if(!cls && !room) store.dailyOverrides[key] = null;
  else store.dailyOverrides[key] = {class: cls, room: room};
  persist();
}
function clearDailyOverride(dateISO, periodKey){
  delete store.dailyOverrides[dateISO+'_'+periodKey];
  persist();
}
// Double periods (e.g. Period 1 & 2 taught as one lesson) are stored as two
// timetable slots that share a class/room and are both flagged `double`.
// These helpers detect that pairing so the UI can show/edit them as one row.
const DOUBLE_PAIRS = [['p1','p2'],['p3','p4'],['p5','p6']];
// Two back-to-back periods with the same class code count as one double lesson.
function isDoubleSlots(a, b){
  return !!(a && b && a.class && a.class===b.class);
}
function doubleRoom(a, b){
  return (!b.room || a.room===b.room) ? a.room : (a.room ? a.room+' / '+b.room : b.room);
}
// A double reads and writes its notes under the first period. If notes were written
// under the second period before it became a double, move them across once.
function adoptPartnerLesson(dateISO, keyA, keyB){
  const a = lessonKey(dateISO, keyA), b = lessonKey(dateISO, keyB);
  if(store.lessons[b] && !store.lessons[a]){ store.lessons[a] = store.lessons[b]; delete store.lessons[b]; persist(); }
}
function pairPartnerKey(periodKey){
  const pair = DOUBLE_PAIRS.find(([a])=>a===periodKey);
  return pair ? pair[1] : null;
}
function computeDayRows(dateISO){
  const rows = [];
  let skip = false;
  for(let i=0;i<PERIODS.length;i++){
    const p = PERIODS[i];
    if(skip){ skip=false; continue; }
    if(p.kind==='fixed'){ rows.push({type:'fixed', period:p}); continue; }
    if(p.key==='after'){ rows.push({type:'after', period:p}); continue; }
    const slot = getSlotForDate(dateISO, p.key);
    const partnerKey = pairPartnerKey(p.key);
    if(partnerKey && slot){
      const partnerSlot = getSlotForDate(dateISO, partnerKey);
      if(isDoubleSlots(slot, partnerSlot)){
        const partnerPeriod = PERIODS.find(pp=>pp.key===partnerKey);
        const label = `${p.label} & ${partnerPeriod.label.split(' ').pop()}`;
        const time = slot.time || (p.time.split('–')[0]+'–'+partnerPeriod.time.split('–')[1]);
        adoptPartnerLesson(dateISO, p.key, partnerKey);
        rows.push({type:'double', periodA:p, periodB:partnerPeriod, slot:Object.assign({}, slot, {room:doubleRoom(slot, partnerSlot)}), label, time});
        skip = true;
        continue;
      }
    }
    rows.push({type:'single', period:p, slot});
  }
  return rows;
}
// Is this a real teaching day — a weekday, in a non-holiday week, and not
// itself marked "Holiday" (e.g. the odd day off around INSET at the very
// start of term)?
function isTeachingDay(dateISO){
  const date = fromISO(dateISO);
  const day = date.getDay();
  if(day===0 || day===6) return false;
  const wk = weekOf(dateISO);
  if(!wk || wk.holiday) return false;
  const dKey = dayKeyOf(date);
  const items = wk.days[dKey] || [];
  if(items.length===1 && items[0]==='Holiday') return false;
  return true;
}
// Weeks / days / lessons remaining between today and RETIREMENT_DATE
// (inclusive of today). A merged double period counts as one lesson,
// matching how the rest of the app treats doubles.
function computeRetirementCountdown(){
  const todayMonday = getMonday(new Date());
  const cd = (store.profile && store.profile.countdown) || {};
  const retirementEnd = fromISO(cd.date || RETIREMENT_DATE);
  const cutoff = cd.cutoff || EARLY_LEAVERS_CUTOFF;
  const weeks = TERM_CALENDAR.filter(wk=>!wk.holiday && fromISO(wk.wb) >= todayMonday && fromISO(wk.wb) <= retirementEnd).length;
  let days = 0, lessons = 0;
  let cur = new Date(); cur.setHours(0,0,0,0);
  while(cur <= retirementEnd){
    const iso = toISO(cur);
    if(isTeachingDay(iso)){
      days++;
      const pastLeaversCutoff = !!cd.excludeEarly && iso > cutoff;
      computeDayRows(iso).forEach(row=>{
        if((row.type==='single' || row.type==='double') && row.slot){
          if(pastLeaversCutoff && EARLY_LEAVER_YEAR_PREFIX.test(row.slot.class)) return;
          lessons++;
        }
      });
    }
    cur = addDays(cur,1);
  }
  return {weeks, days, lessons};
}
function setDailyOverridePair(dateISO, periodAKey, periodBKey, cls, room, combinedTime){
  const keyA = dateISO+'_'+periodAKey, keyB = dateISO+'_'+periodBKey;
  if(!cls && !room){
    store.dailyOverrides[keyA] = null;
    store.dailyOverrides[keyB] = null;
  }else{
    store.dailyOverrides[keyA] = {class:cls, room:room, double:true, time:combinedTime};
    store.dailyOverrides[keyB] = {class:cls, room:room, double:true};
  }
  persist();
}
function clearDailyOverridePair(dateISO, periodAKey, periodBKey){
  delete store.dailyOverrides[dateISO+'_'+periodAKey];
  delete store.dailyOverrides[dateISO+'_'+periodBKey];
  persist();
}
function lessonKey(dateISO, periodKey){ return dateISO+'_'+periodKey; }
function getLesson(dateISO, periodKey){
  return store.lessons[lessonKey(dateISO,periodKey)] || {title:'',notes:'',homework:''};
}
function setLesson(dateISO, periodKey, data){
  const key = lessonKey(dateISO,periodKey);
  const cleaned = {title:data.title||'', notes:data.notes||'', homework:data.homework||''};
  if(!cleaned.title && !cleaned.notes && !cleaned.homework){
    delete store.lessons[key];
  }else{
    store.lessons[key] = cleaned;
  }
  persist();
}
function allClassCodes(){
  const set = new Set(Object.keys(baseClasses()));
  Object.keys(store.classMeta).forEach(c=>set.add(c));
  const tt = baseTimetable();
  ['A','B'].forEach(w=>DAYS.forEach(d=>PERIODS.forEach(pr=>{
    const sl = tt?.[w]?.[d]?.[pr.key]; if(sl && sl.class) set.add(sl.class);
    const ov = store.timetableOverrides?.[w]?.[d]?.[pr.key]; if(ov && ov.class) set.add(ov.class);
  })));
  const hidden = new Set(store.hiddenClasses||[]);
  return Array.from(set).filter(c=>!hidden.has(c));
}
function weekOf(dateISO){
  return TERM_CALENDAR.find(w=>{
    const start = fromISO(w.wb);
    const end = addDays(start,6);
    const d = fromISO(dateISO);
    return d>=start && d<=end;
  });
}
// Meetings/CPD for one specific date, read straight off that date's real
// column in the source calendar table, plus anything the user has added
// manually for that date.
function dayEvents(dateISO){
  const date = fromISO(dateISO);
  const dKey = dayKeyOf(date);
  const wk = weekOf(dateISO);
  const custom = store.customEvents[dateISO] || [];
  if(!wk || !dKey) return {items: custom.slice(), isHoliday:false};
  if(wk.holiday) return {items: custom.slice(), isHoliday: custom.length===0, holidayLabel:wk.note};
  const builtIn = wk.days[dKey] || [];
  const isHolidayDay = builtIn.length===1 && builtIn[0]==='Holiday';
  return {items: (isHolidayDay? [] : builtIn).concat(custom), isHoliday: isHolidayDay && custom.length===0, holidayLabel:'Holiday'};
}
// Renders that date's actual meetings/CPD as a small read-only chip —
// used in the After School slot in Weekly and Daily views.
function dayAgendaChip(dateISO){
  const ev = dayEvents(dateISO);
  if(ev.isHoliday){
    return `<div class="agenda-chip agenda-holiday"><span class="agenda-title">${escapeHtml(ev.holidayLabel)}</span></div>`;
  }
  if(!ev.items.length) return '';
  return `<div class="agenda-chip">
    <span class="agenda-title">Today's meeting / CPD</span>
    <ul>${ev.items.map(e=>`<li>${escapeHtml(e)}</li>`).join('')}</ul>
  </div>`;
}
function addCustomEvent(dateISO, text){
  text = text.trim();
  if(!text) return;
  if(!store.customEvents[dateISO]) store.customEvents[dateISO] = [];
  store.customEvents[dateISO].push(text);
  persist();
}
function removeCustomEvent(dateISO, idx){
  const list = store.customEvents[dateISO];
  if(!list) return;
  list.splice(idx,1);
  if(!list.length) delete store.customEvents[dateISO];
  persist();
}

let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}
function debounce(fn, ms){
  let t; return function(...args){ clearTimeout(t); t=setTimeout(()=>fn.apply(this,args), ms); };
}

const ACTIVITY_TYPES = [

  {key:'club',    label:'Club'},
  {key:'meeting', label:'Meeting'},
  {key:'other',   label:'Other'}
];
const ACTIVITY_SLOTS = ['break','lunch','after'];
function getTemplateActivity(w, day, slot){
  return (store.activities[w] && store.activities[w][day] && store.activities[w][day][slot]) || null;
}
function setTemplateActivity(w, day, slot, type, text){
  if(!store.activities[w][day]) store.activities[w][day] = {};
  if(type) store.activities[w][day][slot] = {type, text};
  else delete store.activities[w][day][slot];
  if(!Object.keys(store.activities[w][day]).length) delete store.activities[w][day];
}
function activityFor(dateISO, slot){
  const date = fromISO(dateISO), d = dayKeyOf(date);
  if(!d || !isTeachingDay(dateISO)) return null;
  return getTemplateActivity(weekTypeFor(date), d, slot);
}
function activityChip(act, compact){
  if(!act) return '';
  const t = ACTIVITY_TYPES.find(x=>x.key===act.type) || ACTIVITY_TYPES[ACTIVITY_TYPES.length-1];
  return `<span class="act-chip act-${t.key} ${compact?'compact':''}"><strong>${t.label}</strong>${act.text? ' '+escapeHtml(act.text):''}</span>`;
}
function activityEditor(w, day, slot){

}

/* ======================================================================
   TO-DO LISTS (weekly + daily)
   ====================================================================== */
function todoList(scope, key){
  return (store.todos[scope] && store.todos[scope][key]) || [];
}
function saveTodoList(scope, key, list){
  if(list.length) store.todos[scope][key] = list;
  else delete store.todos[scope][key];
  persist();
}
function nextWeekdayISO(iso){
  let d = addDays(fromISO(iso), 1);
  while(!dayKeyOf(d)) d = addDays(d, 1);
  return toISO(d);
}
function todoTitle(scope, key){
  const today = new Date();
  if(scope==='week'){
    if(key===toISO(getMonday(today))) return "This week's to-dos";
    return 'To-dos for week of '+fmtShort(fromISO(key));
  }
  if(key===toISO(today)) return "Today's to-dos";
  return 'To-dos for '+fmtShort(fromISO(key));
}
function todoItemHtml(t, src, dayLabel){
  return `<li class="todo-item ${t.done?'done':''}" data-id="${t.id}" ${src? `data-scope="${src.scope}" data-key="${src.key}"` : ''}>
      ${dayLabel? `<span class="todo-day">${dayLabel}</span>` : ''}
      <input type="checkbox" class="todo-check" ${t.done?'checked':''} aria-label="Mark as ${t.done?'not done':'done'}">
      <input type="text" class="todo-text" value="${escapeHtml(t.text)}" aria-label="To-do">
      <button type="button" class="todo-del" aria-label="Delete to-do" title="Delete">${ICONS.close}</button>
    </li>`;
}
// Every daily to-do in the week starting on mondayISO, in day order.
function dailyTodosForWeek(mondayISO){
  const out = [];
  for(let i=0;i<7;i++){
    const iso = toISO(addDays(fromISO(mondayISO), i));
    const dow = fromISO(iso).toLocaleDateString('en-GB',{weekday:'short'});
    todoList('day', iso).forEach(t=>out.push({t, iso, dow}));
  }
  return out;
}
function renderTodoCard(scope, key, extraClass){
  const list = todoList(scope, key);
  const open = list.filter(t=>!t.done);
  const done = list.filter(t=>t.done);
  const items = open.concat(done).map(t=>todoItemHtml(t)).join('');
  const fromDays = scope==='week' ? dailyTodosForWeek(key) : [];
  const dayItems = fromDays.map(x=>todoItemHtml(x.t, {scope:'day', key:x.iso}, x.dow)).join('');
  const total = list.length + fromDays.length;
  const totalDone = done.length + fromDays.filter(x=>x.t.done).length;
  const moveLabel = scope==='week' ? 'Move unfinished to next week' : 'Move unfinished to next school day';
  const actions = [];
  if(open.length && list.length) actions.push(`<button type="button" data-todo-act="move">${moveLabel}</button>`);
  if(done.length) actions.push(`<button type="button" data-todo-act="clear">Clear completed</button>`);
  return `<div class="card ${extraClass||'side-card'} todo-card" data-scope="${scope}" data-key="${key}">
    <div class="todo-head">
      <h3>${todoTitle(scope, key)}</h3>
      ${total? `<span class="todo-count">${totalDone} of ${total} done</span>` : ''}
    </div>
    ${list.length? `<ul class="todo-list">${items}</ul>` : ''}
    ${fromDays.length? `<div class="todo-sub">From your daily lists</div><ul class="todo-list">${dayItems}</ul>` : ''}
    <div class="todo-add">
      <input type="text" class="input todo-new" placeholder="${scope==='week'?'Add something to do this week':'Add something to do'}" aria-label="New to-do">
      <button type="button" class="btn btn-sm" data-todo-act="add">Add</button>
    </div>
    ${actions.length? `<div class="todo-actions">${actions.join('')}</div>` : ''}
  </div>`;
}
// Re-render only the to-do cards on screen, so typing elsewhere on the page is never interrupted.
function refreshTodoCards(focus){
  document.querySelectorAll('.todo-card').forEach(card=>{
    const {scope, key} = card.dataset;
    const cls = ['side-card','todo-card-wide','todo-card-daily'].find(c=>card.classList.contains(c));
    const tmp = document.createElement('div');
    tmp.innerHTML = renderTodoCard(scope, key, cls).trim();
    card.replaceWith(tmp.firstChild);
  });
  if(focus){
    const sel = `.todo-card[data-scope="${focus.scope}"][data-key="${focus.key}"] .todo-new`;
    const el = document.querySelector(sel);
    if(el) el.focus();
  }
}
function todoAdd(card){
  const input = card.querySelector('.todo-new');
  const text = input.value.trim();
  if(!text){ input.focus(); return; }
  const {scope, key} = card.dataset;
  const list = todoList(scope, key).slice();
  list.push({id:uid(), text, done:false});
  saveTodoList(scope, key, list);
  refreshTodoCards({scope, key});
}
function todoUpdate(card, id, fn, item){
  const src = item && item.dataset.scope ? item.dataset : card.dataset;
  const {scope, key} = src;
  const list = todoList(scope, key).map(t=>({...t}));
  const i = list.findIndex(t=>t.id===id);
  if(i<0) return;
  const keep = fn(list[i]);
  if(keep===false) list.splice(i,1);
  saveTodoList(scope, key, list);
}
function todoMoveUnfinished(card){
  const {scope, key} = card.dataset;
  const list = todoList(scope, key);
  const open = list.filter(t=>!t.done);
  if(!open.length) return;
  const targetKey = scope==='week' ? toISO(addDays(fromISO(key),7)) : nextWeekdayISO(key);
  store.todos[scope][targetKey] = todoList(scope, targetKey).concat(open);
  saveTodoList(scope, key, list.filter(t=>t.done));
  refreshTodoCards();
  showToast(`Moved ${open.length} to ${scope==='week' ? 'week of '+fmtShort(fromISO(targetKey)) : fmtShort(fromISO(targetKey))}`);
}
// One set of listeners for every to-do card, on any page.
document.addEventListener('click', e=>{
  const card = e.target.closest('.todo-card');
  if(!card) return;
  const act = e.target.closest('[data-todo-act]');
  if(act){
    const a = act.dataset.todoAct;
    if(a==='add') todoAdd(card);
    if(a==='move') todoMoveUnfinished(card);
    if(a==='clear'){
      const {scope, key} = card.dataset;
      saveTodoList(scope, key, todoList(scope, key).filter(t=>!t.done));
      refreshTodoCards();
    }
    return;
  }
  const del = e.target.closest('.todo-del');
  if(del){
    const it = del.closest('.todo-item');
    todoUpdate(card, it.dataset.id, ()=>false, it);
    refreshTodoCards();
  }
});
document.addEventListener('change', e=>{
  const card = e.target.closest('.todo-card');
  if(!card) return;
  const item = e.target.closest('.todo-item');
  if(!item) return;
  if(e.target.classList.contains('todo-check')){
    todoUpdate(card, item.dataset.id, t=>{ t.done = e.target.checked; }, item);
    refreshTodoCards();
  }else if(e.target.classList.contains('todo-text')){
    const text = e.target.value.trim();
    todoUpdate(card, item.dataset.id, t=>{ if(!text) return false; t.text = text; }, item);
    if(!text) refreshTodoCards();
    else document.querySelectorAll(`.todo-item[data-id="${item.dataset.id}"] .todo-text`).forEach(el=>{ if(el!==e.target) el.value = text; });
  }
});
document.addEventListener('keydown', e=>{
  if(e.key!=='Enter') return;
  const card = e.target.closest && e.target.closest('.todo-card');
  if(!card) return;
  if(e.target.classList.contains('todo-new')){ e.preventDefault(); todoAdd(card); }
  else if(e.target.classList.contains('todo-text')){ e.preventDefault(); e.target.blur(); }
});

/* ======================================================================
   CLASSES — every lesson for one class across the school year
   ====================================================================== */
function sortedClassCodes(){
  return allClassCodes().sort((a,b)=> classInfo(a).label.localeCompare(classInfo(b).label));
}
// Is this class anywhere on the current A/B timetable?
function classOnTimetable(code){
  return ['A','B'].some(w=>DAYS.some(d=>LESSON_PERIODS.some(p=>{ const sl = getSlot(w,d,p.key); return sl && sl.class===code; })));
}
function staleClassCodes(){ return sortedClassCodes().filter(c=>!classOnTimetable(c)); }
function hideClass(code){
  if(!store.hiddenClasses.includes(code)) store.hiddenClasses.push(code);
  persist();
}
function renderClassTabs(codes, active){
  return `<div class="class-tabs">
    ${codes.map(c=>{
      const i = classInfo(c), stale = !classOnTimetable(c);
      return `<span class="class-tab-wrap ${c===active?'active':''} ${stale?'stale':''}">
        <button class="class-tab ${c===active?'active':''}" data-class="${escapeHtml(c)}" ${stale?'title="Not on your timetable"':''}><span class="cc-dot cc-${i.color}"></span> ${escapeHtml(i.label)}</button>
        <button type="button" class="class-tab-del" data-hide-class="${escapeHtml(c)}" aria-label="Remove ${escapeHtml(i.label)} from class lists" title="Remove from lists">${ICONS.close}</button>
      </span>`;
    }).join('')}
  </div>${staleNotice()}`;
}
function staleNotice(){
  const stale = staleClassCodes();
  if(!stale.length) return '';
  return `<p class="stale-note">${stale.length} class${stale.length===1?' isn\'t':'es aren\'t'} on your timetable any more (shown with a dashed outline). <button type="button" class="link-btn" data-hide-stale="1">Remove ${stale.length===1?'it':'them'}</button></p>`;
}
// Removing / restoring classes works the same from every tab.
document.addEventListener('click', e=>{
  const one = e.target.closest('[data-hide-class]');
  if(one){
    const code = one.dataset.hideClass, label = classInfo(code).label;
    const warn = classOnTimetable(code) ? `\n\n${label} is still on your timetable, so it will keep showing there.` : '';
    if(!confirm(`Remove ${label} from your class lists? Its lesson notes and plans are kept, and you can bring it back in Settings.${warn}`)) return;
    hideClass(code);
    showToast(`Removed ${label}`);
    render();
    return;
  }
  if(e.target.closest('[data-hide-stale]')){
    const stale = staleClassCodes();
    if(!confirm(`Remove ${stale.map(c=>classInfo(c).label).join(', ')} from your class lists? Their notes and plans are kept, and you can bring them back in Settings.`)) return;
    stale.forEach(c=>{ if(!store.hiddenClasses.includes(c)) store.hiddenClasses.push(c); });
    persist();
    showToast(`Removed ${stale.length} class${stale.length===1?'':'es'}`);
    render();
    return;
  }
  const restore = e.target.closest('[data-restore-class]');
  if(restore){
    store.hiddenClasses = store.hiddenClasses.filter(c=>c!==restore.dataset.restoreClass);
    persist();
    showToast(`Restored ${classInfo(restore.dataset.restoreClass).label}`);
    render();
  }
});
function lessonsForClass(code){
  const out = [];
  let half = 0, seenTeaching = false;
  TERM_CALENDAR.forEach(wk=>{
    if(wk.holiday){ if(seenTeaching){ half++; seenTeaching = false; } return; }
    const monday = fromISO(wk.wb);
    for(let i=0;i<5;i++){
      const iso = toISO(addDays(monday,i));
      if(!isTeachingDay(iso)) continue;
      seenTeaching = true;
      computeDayRows(iso).forEach(row=>{
        if(row.type!=='single' && row.type!=='double') return;
        if(!row.slot || row.slot.class!==code) return;
        const periodKey = row.type==='double' ? row.periodA.key : row.period.key;
        out.push({
          iso, wb:wk.wb, weekType:wk.type, half:HALF_TERMS[Math.min(half, HALF_TERMS.length-1)],
          periodKey, label: row.type==='double' ? row.label : row.period.label,
          time: row.type==='double' ? row.time : row.period.time,
          room: row.slot.room, lesson: getLesson(iso, periodKey)
        });
      });
    }
  });
  return out;
}
function renderClasses(){
  const codes = sortedClassCodes();
  if(!codes.length) return `<div class="page-head"><h1 class="page-title">Classes</h1></div><p class="empty-note">No classes to show. Add classes in Settings → Open setup, or bring back removed ones in Settings.</p>`;
  if(!state.classesCode || !codes.includes(state.classesCode)) state.classesCode = codes[0];
  if(!state.classesFilter) state.classesFilter = 'upcoming';
  const code = state.classesCode, info = classInfo(code), filter = state.classesFilter;
  const todayISO = toISO(new Date());
  const all = lessonsForClass(code);
  const shown = filter==='upcoming' ? all.filter(l=>l.iso>=todayISO)
              : filter==='past' ? all.filter(l=>l.iso<todayISO).reverse()
              : all;
  const planned = shown.filter(l=>l.lesson.title || l.lesson.notes).length;

  let body = '';
  if(!shown.length){
    body = `<p class="empty-note">${filter==='upcoming' ? 'No more timetabled lessons for this class this year.' : filter==='past' ? 'No lessons with this class yet this year.' : 'This class has no timetabled lessons this year.'}</p>`;
  }else{
    let lastHalf = null, lastWeek = null, open = false;
    shown.forEach(l=>{
      if(l.half!==lastHalf){
        if(open) body += `</div>`;
        body += `<div class="cls-group"><h2>${l.half}</h2>`;
        open = true; lastHalf = l.half; lastWeek = null;
      }
      if(l.wb!==lastWeek){
        body += `<div class="cls-week">Week beginning ${fmtShort(fromISO(l.wb))}${l.weekType? ' (Week '+l.weekType+')':''}</div>`;
        lastWeek = l.wb;
      }
      const d = fromISO(l.iso);
      const dow = d.toLocaleDateString('en-GB',{weekday:'short'});
      body += `<button type="button" class="cls-lesson ${l.iso===todayISO?'is-today':''}" style="border-left-color:var(--${info.color})" data-date="${l.iso}" data-period="${l.periodKey}">
        <span class="cls-when"><strong>${dow} ${fmtShort(d)}</strong>${l.label}<br>${l.time}${l.room? ', '+escapeHtml(l.room):''}</span>
        <span class="cls-body">
          <span class="cls-title ${l.lesson.title?'':'empty'}" style="display:block;">${l.lesson.title? escapeHtml(l.lesson.title) : 'No plan yet'}</span>
          ${l.lesson.notes? `<span class="cls-notes" style="display:-webkit-box;">${escapeHtml(l.lesson.notes)}</span>`:''}
          ${l.lesson.homework? `<span class="cls-hw" style="display:block;">Homework: ${escapeHtml(l.lesson.homework)}</span>`:''}
        </span>
      </button>`;
    });
    if(open) body += `</div>`;
  }

  return `
    <div class="page-head">
      <p class="page-eyebrow">Classes</p>
      <h1 class="page-title">${escapeHtml(info.label)}</h1>
    </div>
    ${renderClassTabs(codes, code)}
    <div class="cls-toolbar">
      <div class="seg" role="group" aria-label="Which lessons to show">
        ${[['upcoming','Upcoming'],['past','Past'],['all','Whole year']].map(([k,l])=>`<button type="button" data-cls-filter="${k}" aria-pressed="${k===filter}">${l}</button>`).join('')}
      </div>
      ${shown.length? `<span class="cls-summary">${shown.length} lesson${shown.length===1?'':'s'}, ${planned} planned</span>` : ''}
    </div>
    ${body}
  `;
}

/* ======================================================================
   HOMEWORK TIMETABLE — classes down the side, days across, A/B weeks
   ====================================================================== */
function getHomework(w, code, day){
  return (store.homework[w] && store.homework[w][code] && store.homework[w][code][day]) || '';
}
function setHomework(w, code, day, text){
  if(!store.homework[w][code]) store.homework[w][code] = {};
  if(text) store.homework[w][code][day] = text;
  else delete store.homework[w][code][day];
  if(!Object.keys(store.homework[w][code]).length) delete store.homework[w][code];
}
function hwWorkKey(iso, code){ return iso+'_'+code; }
function getHwWork(iso, code){
  return store.homeworkWork[hwWorkKey(iso, code)] || {content:'', created:false, smhw:false};
}
function setHwWork(iso, code, patch){
  const k = hwWorkKey(iso, code);
  const next = Object.assign({}, getHwWork(iso, code), patch);
  if(!next.content && !next.created && !next.smhw) delete store.homeworkWork[k];
  else store.homeworkWork[k] = next;
}
// The slots shown for a real week: every template entry for that week's A/B type, on teaching days.
function hwSlotsForWeek(monday){
  const w = weekTypeFor(monday), out = [];
  sortedClassCodes().forEach(code=>DAYS.forEach((d,i)=>{
    const iso = toISO(addDays(monday,i));
    if(isTeachingDay(iso) && getHomework(w, code, d)) out.push({iso, code});
  }));
  return out;
}
function hwSummaryText(monday){
  const slots = hwSlotsForWeek(monday);
  if(!slots.length) return '';
  const created = slots.filter(x=>getHwWork(x.iso,x.code).created).length;
  const smhw = slots.filter(x=>getHwWork(x.iso,x.code).smhw).length;
  return `${slots.length} homework${slots.length===1?'':'s'} this week: ${created} created, ${smhw} on SMHW`;
}
// Homework due to show on a lesson: only on that class's first lesson of the day, so it never repeats.
function hwTagForLesson(iso, code, periodKey){
  const date = fromISO(iso), d = dayKeyOf(date);
  if(!d || !code || !isTeachingDay(iso)) return '';
  const label = getHomework(weekTypeFor(date), code, d);
  if(!label) return '';
  const first = LESSON_PERIODS.find(p=>p.key!=='after' && (getSlotForDate(iso, p.key)||{}).class===code);
  if(!first || first.key!==periodKey) return '';
  const w = getHwWork(iso, code);
  const done = w.created && w.smhw;
  const status = done ? 'Created, on SMHW' : w.created ? 'Created, not on SMHW yet' : 'Not created yet';
  return `<span class="tt-hw ${done?'done':''}" title="Homework: ${status}">
    <span class="tt-hw-label">Hwk: ${escapeHtml(label)}${w.content? ', '+escapeHtml(w.content) : ''}</span>
    <span class="tt-hw-ticks"><span class="${w.created?'on':''}">Created</span><span class="${w.smhw?'on':''}">SMHW</span></span>
  </span>`;
}
// Editable homework box for the Dashboard and Daily View (same data as the Homework Timetable tab).
function hwInlineForLesson(iso, code, periodKey, withContentBox){
  const date = fromISO(iso), d = dayKeyOf(date);
  if(!d || !code || !isTeachingDay(iso)) return '';
  const label = getHomework(weekTypeFor(date), code, d);
  if(!label) return '';
  const first = LESSON_PERIODS.find(p=>p.key!=='after' && (getSlotForDate(iso, p.key)||{}).class===code);
  if(!first || first.key!==periodKey) return '';
  const w = getHwWork(iso, code);
  return `<div class="hw-inline ${w.created && w.smhw?'done':''}" data-iso="${iso}" data-class="${escapeHtml(code)}">
    <div class="hw-inline-head"><span class="hw-inline-label">Homework: ${escapeHtml(label)}</span>
      <label class="hw-tick"><input type="checkbox" data-field="created" ${w.created?'checked':''}> Created</label>
      <label class="hw-tick"><input type="checkbox" data-field="smhw" ${w.smhw?'checked':''}> On SMHW</label>
    </div>
    ${withContentBox
      ? `<textarea class="hw-inline-content" rows="2" placeholder="Homework details" aria-label="Homework details">${escapeHtml(w.content)}</textarea>`
      : (w.content? `<div class="hw-inline-text">${escapeHtml(w.content)}</div>` : '')}
  </div>`;
}
document.addEventListener('change', e=>{
  const box = e.target.closest && e.target.closest('.hw-inline');
  if(!box || !e.target.matches('input[type=checkbox]')) return;
  setHwWork(box.dataset.iso, box.dataset.class, {[e.target.dataset.field]: e.target.checked});
  persist();
  const w = getHwWork(box.dataset.iso, box.dataset.class);
  box.classList.toggle('done', w.created && w.smhw);
});
const persistSoon = debounce(()=>persist(), 400);
document.addEventListener('input', e=>{
  if(!(e.target.classList && e.target.classList.contains('hw-inline-content'))) return;
  const box = e.target.closest('.hw-inline');
  setHwWork(box.dataset.iso, box.dataset.class, {content: e.target.value.trim()});
  persistSoon();
});
function renderHomework(){
  const editing = !!state.editingHomework;
  const codes = sortedClassCodes();
  if(!state.hwMonday) state.hwMonday = getMonday(new Date());

  // ---------- Edit mode: the repeating A/B template ----------
  if(editing){
    if(!state.hwWeek) state.hwWeek = weekTypeFor(state.hwMonday) || 'A';
    const w = state.hwWeek;
    const head = `<div class="tt-cell tt-head">Class</div>` + DAYS.map(d=>`<div class="tt-cell tt-head"><span class="dow">${DAY_FULL[d]}</span></div>`).join('');

        DAYS.map(d=>`<div class="tt-cell hw-edit"><textarea class="hw-input" data-class="${escapeHtml(code)}" data-day="${d}" placeholder="—" aria-label="${escapeHtml(info.label)} ${DAY_FULL[d]}">${escapeHtml(getHomework(w, code, d))}</textarea></div>`).join('');

      <p class="empty-note" style="margin:-10px 0 14px;">Write a short label wherever a class has homework, e.g. "Set" or "Sparx". Each one becomes a homework slot, with its own content box and ticks, every Week ${w}. Leave a cell blank for no homework.</p>
      ${staleNotice()}

  }

  // ---------- Normal mode: a real week, with content + ticks ----------
  const monday = state.hwMonday;

  const todayISO = toISO(new Date());
  const head = `<div class="tt-cell tt-head">Class</div>` + DAYS.map((d,i)=>{
    const date = addDays(monday,i), iso = toISO(date);

  }).join('');
  const rows = codes.map(code=>{
    const info = classInfo(code);
    return `<div class="tt-cell hw-class-cell ${classOnTimetable(code)?'':'stale'}"><span class="cc-dot cc-${info.color}"></span><span class="hw-class-name">${escapeHtml(info.label)}</span><button type="button" class="class-tab-del" data-hide-class="${escapeHtml(code)}" aria-label="Remove ${escapeHtml(info.label)} from class lists" title="Remove from lists">${ICONS.close}</button></div>` +
      DAYS.map((d,i)=>{
        const iso = toISO(addDays(monday,i));
        const slot = getHomework(w, code, d);
        if(!slot || !isTeachingDay(iso)) return `<div class="tt-cell hw-cell ${isTeachingDay(iso)?'':'hw-off'}"></div>`;
        const work = getHwWork(iso, code);
        const k = escapeHtml(hwWorkKey(iso, code));

          <label class="hw-tick"><input type="checkbox" data-field="smhw" ${work.smhw?'checked':''}> On SMHW</label>
        </div>`;
      }).join('');
  }).join('');
  const hasTemplate = codes.some(c=>DAYS.some(d=>getHomework('A',c,d)||getHomework('B',c,d)));
  const summary = hwSummaryText(monday);
  let note = '';
  if(!hasTemplate) note = `Nothing here yet. Tap "Edit homework timetable" to choose which classes get homework on which days.`;
  else if(wk && wk.holiday) note = `${escapeHtml(wk.note||'Holiday')}, so there's no homework this week.`;
  return `

      <button class="btn btn-sm" id="hw-today">This week</button>
      <span style="flex:1;"></span>
      <button class="btn btn-sm" id="hw-edit-toggle">Edit homework timetable</button>

    ${note? `<p class="empty-note" style="margin:-10px 0 14px;">${note}</p>` : ''}

  `;
}

function renderWeekEventsList(wk){
  const start = fromISO(wk.wb);
  if(wk.holiday){
    const customLines = DAYS.map((d,i)=>{
      const dateISO = toISO(addDays(start,i));
      const custom = store.customEvents[dateISO]||[];
      if(!custom.length) return '';
      return `<li><strong>${d}:</strong> ${custom.map(escapeHtml).join(' · ')}</li>`;
    }).join('');
    return `<div class="pill pill-brick">${escapeHtml(wk.note)}</div>${customLines? `<ul style="margin:8px 0 0;padding-left:16px;font-size:13px;line-height:1.7;">${customLines}</ul>`:''}`;
  }
  const dayLines = DAYS.map((d,i)=>{
    const dateISO = toISO(addDays(start,i));
    const builtIn = wk.days[d]||[];
    const isHol = builtIn.length===1 && builtIn[0]==='Holiday';
    const custom = store.customEvents[dateISO]||[];
    const items = (isHol? [] : builtIn).concat(custom);
    if(!items.length) return '';
    return `<li><strong>${d}:</strong> ${items.map(escapeHtml).join(' · ')}</li>`;
  }).join('');
  const tagLine = [...wk.sesi.map(s=>`<span class="pill pill-slate">${escapeHtml(s)}</span>`),
                    ...wk.arr.map(a=>`<span class="pill pill-gold">${escapeHtml(a)}</span>`)].join(' ');
  return `${wk.type?`<span class="pill pill-forest" style="margin-bottom:8px;">Week ${wk.type}</span>`:''}
  <ul style="margin:8px 0 0;padding-left:16px;font-size:13px;line-height:1.7;">
    ${dayLines || '<li class="empty-note">No meetings logged this week.</li>'}
  </ul>
  ${tagLine? `<div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:5px;">${tagLine}</div>` : ''}`;
}
function escapeHtml(s){
  return (s+'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
