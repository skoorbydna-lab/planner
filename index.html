<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Andy Brooks — Weekly Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Libre+Franklin:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================= TOKENS ============================= */
:root{
  --paper:#F5F1E7;
  --paper-dim:#ECE4D3;
  --paper-card:#FFFDF9;
  --ink:#232C33;
  --ink-soft:#5B6670;
  --ink-faint:#8A9199;
  --line:#DCD3BE;
  --line-soft:#E7E0CF;
  --forest:#31513B;
  --forest-light:#4C7458;
  --forest-wash:#E4EBE3;
  --gold:#9C7A2E;
  --gold-wash:#F1E7CE;
  --brick:#93463A;
  --brick-wash:#F1DFD9;
  --slate:#3D5670;
  --slate-wash:#E3E9EE;
  --teal:#2C6E6B;
  --teal-wash:#DDEBEA;
  --navy:#2E4B6B;
  --navy-wash:#DCE4EC;
  --plum:#6B4468;
  --plum-wash:#ECE0EA;
  --rust:#B15C2E;
  --rust-wash:#F3E4D6;
  --olive:#6E6B2E;
  --olive-wash:#EDEBD9;
  --clay:#A85A3E;
  --clay-wash:#F1E1D8;
  --berry:#7A3B54;
  --berry-wash:#EEE0E6;
  --sidebar-bg:#20272C;
  --sidebar-ink:#C9CFC9;
  --sidebar-active:#31513B;
  --shadow:0 1px 2px rgba(35,44,51,0.06), 0 4px 14px rgba(35,44,51,0.06);
  --radius:10px;
  --font-display:'Fraunces', Georgia, serif;
  --font-body:'Libre Franklin', -apple-system, BlinkMacSystemFont, sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-body);
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--gold-wash);}
button{font-family:inherit;}
textarea, input{font-family:inherit;}
a{color:inherit;}

/* focus visibility */
button:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible{
  outline:2px solid var(--forest-light);
  outline-offset:2px;
}

/* ============================= LAYOUT ============================= */
#app{
  display:block;
  min-height:100vh;
}
.sidebar{
  width:224px;
  flex-shrink:0;
  background:var(--sidebar-bg);
  color:var(--sidebar-ink);
  display:flex;
  flex-direction:column;
  padding:22px 14px;
  position:fixed;
  left:0;
  top:0;
  height:100vh;
  z-index:30;
  transition:transform .28s ease;
}
body.nav-hidden .sidebar{ transform:translateX(-100%); }
.nav-reveal{
  position:fixed;
  left:14px;
  top:14px;
  z-index:31;
  width:38px;height:38px;
  border-radius:9px;
  border:1px solid var(--line);
  background:var(--paper-card);
  box-shadow:var(--shadow);
  display:none;
  align-items:center;justify-content:center;
  cursor:pointer;
}
.nav-reveal svg{width:17px;height:17px;color:var(--ink);}
body.nav-hidden .nav-reveal{display:flex;}
.sidebar-brand{
  font-family:var(--font-display);
  font-size:19px;
  color:#F2EEE3;
  padding:2px 10px 4px;
  line-height:1.25;
}
.sidebar-sub{
  font-size:11.5px;
  color:#8B958E;
  padding:0 10px 22px;
  letter-spacing:.01em;
}
.nav-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 10px;
  border-radius:8px;
  cursor:pointer;
  font-size:14.5px;
  color:var(--sidebar-ink);
  margin-bottom:2px;
  border:none;
  background:none;
  width:100%;
  text-align:left;
}
.nav-item svg{width:17px;height:17px;flex-shrink:0;opacity:.85;}
.nav-item:hover{background:rgba(255,255,255,0.06);}
.nav-item.active{background:var(--sidebar-active);color:#fff;}
.nav-item.active svg{opacity:1;}
.sidebar-foot{
  margin-top:auto;
  padding:10px;
  font-size:11.5px;
  color:#75807A;
  line-height:1.5;
}

.main{
  margin-left:224px;
  padding:34px 40px 80px;
  max-width:1180px;
  transition:margin-left .28s ease;
}
body.nav-hidden .main{ margin-left:0; }
.page-head{
  margin-bottom:26px;
}
.page-eyebrow{
  font-size:13px;
  color:var(--ink-soft);
  margin:0 0 2px;
}
.page-title{
  font-family:var(--font-display);
  font-size:30px;
  font-weight:500;
  margin:0;
  color:var(--ink);
}

/* mobile: sidebar becomes a top scroll bar */
@media (max-width:860px){
  #app{}
  .sidebar{
    width:100%;
    height:58px;
    position:fixed;
    top:0; left:0;
    z-index:30;
    flex-direction:row;
    align-items:center;
    padding:10px 10px;
    overflow-x:auto;
    gap:2px;
  }
  body.nav-hidden .sidebar{ transform:translateY(-100%); }
  .sidebar-brand,.sidebar-sub,.sidebar-foot{display:none;}
  .nav-item{width:auto;white-space:nowrap;flex-shrink:0;}
  .main{margin-left:0;margin-top:58px;padding:20px 16px 70px;}
  body.nav-hidden .main{margin-top:0;}
  .page-title{font-size:24px;}
}

/* ============================= COMMON UI ============================= */
.card{
  background:var(--paper-card);
  border:1px solid var(--line-soft);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.btn{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:8px 14px;
  border-radius:8px;
  border:1px solid var(--line);
  background:var(--paper-card);
  color:var(--ink);
  font-size:13.5px;
  font-weight:500;
  cursor:pointer;
}
.btn:hover{border-color:var(--ink-faint);}
.btn-primary{
  background:var(--forest);
  border-color:var(--forest);
  color:#fff;
}
.btn-primary:hover{background:var(--forest-light);border-color:var(--forest-light);}
.btn-ghost{background:transparent;border-color:transparent;}
.btn-ghost:hover{background:var(--paper-dim);}
.btn-danger{color:var(--brick);}
.btn-sm{padding:5px 10px;font-size:12.5px;}
.icon-btn{
  width:32px;height:32px;
  display:inline-flex;align-items:center;justify-content:center;
  border-radius:7px;border:1px solid var(--line);background:var(--paper-card);cursor:pointer;
}
.icon-btn svg{width:15px;height:15px;}
.icon-btn:hover{border-color:var(--ink-faint);}

textarea, .input{
  width:100%;
  border:1px solid var(--line);
  border-radius:8px;
  padding:9px 11px;
  font-size:14px;
  color:var(--ink);
  background:#fff;
  resize:vertical;
  line-height:1.5;
}
textarea:focus, .input:focus{border-color:var(--forest-light);}
label.field-label{
  font-size:12px;
  font-weight:600;
  color:var(--ink-soft);
  text-transform:uppercase;
  letter-spacing:.04em;
  margin-bottom:5px;
  display:block;
}

.pill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  font-size:11.5px;
  font-weight:600;
  padding:3px 9px;
  border-radius:20px;
  line-height:1.6;
  white-space:nowrap;
}
.pill-forest{background:var(--forest-wash);color:var(--forest);}
.pill-gold{background:var(--gold-wash);color:var(--gold);}
.pill-brick{background:var(--brick-wash);color:var(--brick);}
.pill-slate{background:var(--slate-wash);color:var(--slate);}
.pill-teal{background:var(--teal-wash);color:var(--teal);}
.pill-navy{background:var(--navy-wash);color:var(--navy);}
.pill-plum{background:var(--plum-wash);color:var(--plum);}
.pill-rust{background:var(--rust-wash);color:var(--rust);}
.pill-olive{background:var(--olive-wash);color:var(--olive);}
.pill-clay{background:var(--clay-wash);color:var(--clay);}
.pill-berry{background:var(--berry-wash);color:var(--berry);}
.pill-muted{background:var(--paper-dim);color:var(--ink-soft);}

/* class colour-coding: a soft wash background + solid left accent bar,
   used on timetable cells / period rows / plan tabs so each class reads
   at a glance without needing to read the label. */
.cc-forest{background:var(--forest-wash);border-left:3px solid var(--forest);}
.cc-gold{background:var(--gold-wash);border-left:3px solid var(--gold);}
.cc-brick{background:var(--brick-wash);border-left:3px solid var(--brick);}
.cc-slate{background:var(--slate-wash);border-left:3px solid var(--slate);}
.cc-teal{background:var(--teal-wash);border-left:3px solid var(--teal);}
.cc-navy{background:var(--navy-wash);border-left:3px solid var(--navy);}
.cc-plum{background:var(--plum-wash);border-left:3px solid var(--plum);}
.cc-rust{background:var(--rust-wash);border-left:3px solid var(--rust);}
.cc-olive{background:var(--olive-wash);border-left:3px solid var(--olive);}
.cc-clay{background:var(--clay-wash);border-left:3px solid var(--clay);}
.cc-berry{background:var(--berry-wash);border-left:3px solid var(--berry);}
.cc-dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-right:6px;}
.cc-dot.cc-forest{background:var(--forest);border-left:none;}
.cc-dot.cc-gold{background:var(--gold);border-left:none;}
.cc-dot.cc-brick{background:var(--brick);border-left:none;}
.cc-dot.cc-slate{background:var(--slate);border-left:none;}
.cc-dot.cc-teal{background:var(--teal);border-left:none;}
.cc-dot.cc-navy{background:var(--navy);border-left:none;}
.cc-dot.cc-plum{background:var(--plum);border-left:none;}
.cc-dot.cc-rust{background:var(--rust);border-left:none;}
.cc-dot.cc-olive{background:var(--olive);border-left:none;}
.cc-dot.cc-clay{background:var(--clay);border-left:none;}
.cc-dot.cc-berry{background:var(--berry);border-left:none;}
.tt-cc-forest{border-left:4px solid var(--forest);}
.tt-cc-gold{border-left:4px solid var(--gold);}
.tt-cc-brick{border-left:4px solid var(--brick);}
.tt-cc-slate{border-left:4px solid var(--slate);}
.tt-cc-teal{border-left:4px solid var(--teal);}
.tt-cc-navy{border-left:4px solid var(--navy);}
.tt-cc-plum{border-left:4px solid var(--plum);}
.tt-cc-rust{border-left:4px solid var(--rust);}
.tt-cc-olive{border-left:4px solid var(--olive);}
.tt-cc-clay{border-left:4px solid var(--clay);}
.tt-cc-berry{border-left:4px solid var(--berry);}

.empty-note{
  color:var(--ink-faint);
  font-size:13.5px;
  font-style:italic;
}

/* ============================= DASHBOARD ============================= */
.dash-grid{
  display:grid;
  grid-template-columns:1.6fr 1fr;
  gap:20px;
}
@media (max-width:940px){.dash-grid{grid-template-columns:1fr;}}

.today-strip{
  display:flex;justify-content:space-between;align-items:baseline;
  margin-bottom:16px;flex-wrap:wrap;gap:8px;
}
.today-date{font-family:var(--font-display);font-size:20px;}
.period-row{
  display:flex;
  gap:14px;
  padding:14px 4px;
  border-bottom:1px solid var(--line-soft);
  align-items:flex-start;
}
.period-row:last-child{border-bottom:none;}
.period-time{
  width:76px;flex-shrink:0;font-size:12px;color:var(--ink-soft);padding-top:2px;
}
.period-time strong{display:block;font-size:13px;color:var(--ink);font-weight:600;}
.period-main{flex:1;min-width:0;}
.period-class-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px;}
.period-class-name{font-weight:600;font-size:14.5px;}
.period-room{font-size:12.5px;color:var(--ink-soft);}
.period-fixed{
  padding:8px 4px;
  color:var(--ink-faint);
  font-size:12.5px;
  border-bottom:1px solid var(--line-soft);
  display:flex;gap:14px;
}
.period-fixed .period-time{width:76px;flex-shrink:0;}
.lesson-preview{
  font-size:13px;color:var(--ink-soft);
  cursor:pointer;
  padding:6px 9px;
  background:var(--paper-dim);
  border-radius:6px;
  margin-top:2px;
}
.lesson-preview:hover{background:var(--line-soft);}
.lesson-preview.empty{color:var(--ink-faint);font-style:italic;}

.side-card{padding:18px;margin-bottom:18px;}
.side-card h3{
  font-family:var(--font-display);font-weight:500;font-size:16px;margin:0 0 12px;
}
.mini-event{
  font-size:13px;padding:7px 0;border-bottom:1px solid var(--line-soft);
  display:flex;gap:8px;align-items:flex-start;
}
.mini-event:last-child{border-bottom:none;}

/* ============================= TIMETABLE GRID ============================= */
.week-nav{
  display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap;
}
.week-nav .range{font-family:var(--font-display);font-size:17px;}

.tt-grid{
  display:grid;
  grid-template-columns:92px repeat(5, 1fr);
  border:1px solid var(--line-soft);
  border-radius:var(--radius);
  overflow:hidden;
  background:var(--paper-card);
}
.tt-cell{
  border-bottom:1px solid var(--line-soft);
  border-right:1px solid var(--line-soft);
  padding:9px 8px;
  min-height:58px;
}
.tt-grid > .tt-cell:nth-child(6n){border-right:none;}
.tt-head{
  background:var(--paper-dim);
  font-size:12px;font-weight:600;
  display:flex;flex-direction:column;justify-content:center;
  min-height:auto;
  padding:10px 8px;
}
.tt-head .dow{font-size:13px;}
.tt-head .ddate{font-size:11px;color:var(--ink-soft);font-weight:500;}
.tt-time-cell{
  background:var(--paper-dim);
  font-size:11px;color:var(--ink-soft);
  display:flex;flex-direction:column;justify-content:center;
}
.tt-time-cell strong{font-size:12px;color:var(--ink);}
.tt-fixed-row .tt-cell{min-height:26px;background:#F1ECDF;color:var(--ink-faint);font-size:11px;display:flex;align-items:center;}
.tt-lesson-cell{
  cursor:pointer;
  display:flex;flex-direction:column;gap:2px;
}
.tt-lesson-cell:hover{background:var(--forest-wash);}
.tt-lesson-cell .cname{font-size:12.5px;font-weight:600;line-height:1.25;}
.tt-lesson-cell .croom{font-size:11px;color:var(--ink-soft);}
.tt-lesson-cell .cnote{font-size:10.5px;color:var(--forest);margin-top:2px;}
.tt-lesson-cell.empty{color:var(--ink-faint);font-size:11.5px;font-style:italic;}
.tt-lesson-cell.today-col{background:var(--gold-wash);}
.agenda-chip{
  background:var(--gold-wash);
  border:1px solid #E4D3A4;
  border-radius:7px;
  padding:6px 8px;
  margin-bottom:6px;
}
.agenda-chip .agenda-title{font-size:10.5px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.03em;display:block;margin-bottom:3px;}
.agenda-chip ul{margin:0;padding-left:14px;font-size:11px;line-height:1.55;color:var(--ink-soft);}
.agenda-chip.agenda-holiday{background:var(--brick-wash);border-color:#DDBBB2;}
.agenda-chip.agenda-holiday .agenda-title{color:var(--brick);}
.daily-agenda .agenda-title{font-size:11.5px;}
.daily-agenda ul{font-size:12.5px;}
.tt-double-joined{border-top:none !important;}

.tt-edit-row .tt-cell input{
  width:100%;border:1px solid var(--line);border-radius:5px;padding:4px 5px;font-size:11px;margin-bottom:3px;
}

@media (max-width:860px){
  .tt-grid{grid-template-columns:70px repeat(5, minmax(84px,1fr));font-size:11px;overflow-x:auto;}
  .tt-grid{display:grid;}
  .main{overflow-x:hidden;}
}
.tt-scroll{overflow-x:auto;}

/* ============================= DAILY VIEW ============================= */
.day-picker{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
.daily-period{
  display:flex;gap:16px;padding:16px 0;border-bottom:1px solid var(--line-soft);
}
.daily-period:last-child{border-bottom:none;}
.daily-time-col{width:96px;flex-shrink:0;}
.daily-time-col .lbl{font-weight:600;font-size:13.5px;}
.daily-time-col .tm{font-size:11.5px;color:var(--ink-soft);}
.daily-body{flex:1;min-width:0;}
.daily-fixed{padding:10px 0 10px 112px;color:var(--ink-faint);font-size:12.5px;border-bottom:1px solid var(--line-soft);}
.daily-class-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.daily-class-head input.input{padding:6px 9px;font-size:13px;}
.daily-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media (max-width:700px){.daily-fields{grid-template-columns:1fr;}}
.daily-fields .full{grid-column:1/-1;}

/* ============================= MODAL ============================= */
.modal-overlay{
  position:fixed;inset:0;background:rgba(32,39,44,0.45);
  display:flex;align-items:center;justify-content:center;
  z-index:100;padding:20px;
}
.modal{
  background:var(--paper-card);
  border-radius:12px;
  max-width:560px;width:100%;
  max-height:88vh;overflow-y:auto;
  padding:24px 26px 22px;
  box-shadow:0 12px 40px rgba(0,0,0,0.25);
}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;gap:10px;}
.modal-head h3{font-family:var(--font-display);font-size:19px;font-weight:500;margin:0 0 4px;}
.modal-head .sub{font-size:12.5px;color:var(--ink-soft);}
.field-group{margin-bottom:14px;}
.modal-actions{display:flex;justify-content:space-between;margin-top:18px;gap:10px;}

/* ============================= CALENDAR ============================= */
.term-controls{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
.week-card{
  padding:15px 18px;margin-bottom:12px;
}
.week-card.holiday{background:var(--brick-wash);border-color:var(--brick-wash);}
.week-card.current{border-color:var(--forest);box-shadow:0 0 0 2px var(--forest) inset, var(--shadow);}
.week-card-head{display:flex;align-items:baseline;gap:10px;margin-bottom:8px;flex-wrap:wrap;}
.week-card-head .wb{font-weight:600;font-size:14.5px;}
.week-card ul{margin:0;padding-left:18px;font-size:13.5px;line-height:1.7;}
.week-card.holiday ul, .week-card.holiday .wb{color:var(--brick);}

/* ============================= LONG TERM PLANS ============================= */
.class-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px;}
.class-tab{
  padding:7px 13px;border-radius:20px;border:1px solid var(--line);
  background:var(--paper-card);font-size:13px;font-weight:500;cursor:pointer;
}
.class-tab.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.plan-half{margin-bottom:16px;}
.plan-half .field-label{margin-bottom:6px;}

/* ============================= SETTINGS ============================= */
.settings-block{padding:20px 22px;margin-bottom:18px;}
.settings-block h3{font-family:var(--font-display);font-weight:500;font-size:17px;margin:0 0 6px;}
.settings-block p{font-size:13.5px;color:var(--ink-soft);line-height:1.6;margin:0 0 12px;}
.row-flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}

.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:9px 18px;border-radius:20px;
  font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,0.25);z-index:200;
  opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}
</style>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<div id="app">
  <button class="nav-reveal" id="nav-reveal" aria-label="Show menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
  </button>
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-brand">Andy Brooks</div>
    <div class="sidebar-sub">Weekly Planner</div>
    <div id="nav-items"></div>
    <div class="sidebar-foot">Saved automatically<br>on this device.</div>
  </nav>
  <main class="main" id="main"></main>
</div>
<div id="modal-root"></div>
<div class="toast" id="toast"></div>

<script>
/* ======================================================================
   DATA — reconstructed from Andy's timetable & CPD calendar PDFs
   ====================================================================== */

const PERIODS = [
  {key:'reg',   label:'Registration',  time:'08:45–09:05', kind:'lesson'},
  {key:'p1',    label:'Period 1',      time:'09:05–09:55', kind:'lesson'},

const STORAGE_KEY = 'plannerData_andyBrooks_v1';

function defaultStore(){
  return {
    lessons: {},           // "YYYY-MM-DD_periodKey" -> {title, notes, homework}
    longTermPlans: {},     // classCode -> {label, colorNote, plan: {ht1..ht6: text}}
    classMeta: {},         // classCode -> {label, color}  (overrides DEFAULT_CLASSES)
    timetableOverrides: {},// weekType -> day -> periodKey -> {class, room} (overrides DEFAULT_TIMETABLE — permanent, e.g. a room correction)
    dailyOverrides: {},    // "YYYY-MM-DD_periodKey" -> {class, room} (one-off, e.g. cover or a single room change)
    afterSchool: {},       // "YYYY-MM-DD" -> text (After School slot is free-text, not tied to a class)
    weekAnchor: WEEK_ANCHOR,
    weekAnchorType: WEEK_ANCHOR_TYPE,
    lastModified: 0
  };
}

let store = loadStore();

function loadStore(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultStore();
    const parsed = JSON.parse(raw);
    return Object.assign(defaultStore(), parsed);
  }catch(e){
    console.error('Could not read saved planner data, starting fresh.', e);
    return defaultStore();
  }
}
function persist(){
  try{
    store.lastModified = Date.now();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
  }catch(e){
    showToast('Could not save — your browser storage may be full.');
  }
}

/* ======================================================================
   UTILITIES
   ====================================================================== */
function pad(n){ return n<10 ? '0'+n : ''+n; }
function toISO(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function fromISO(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function addDays(d, n){ const nd=new Date(d); nd.setDate(nd.getDate()+n); return nd; }
function getMonday(d){
  const nd = new Date(d);
  const day = nd.getDay(); // 0 Sun .. 6 Sat
  const diff = (day===0? -6 : 1-day);
  nd.setDate(nd.getDate()+diff);
  nd.setHours(0,0,0,0);
  return nd;
}
function fmtLong(d){
  return d.toLocaleDateString('en-GB',{weekday:'long', day:'numeric', month:'long'});
}
function fmtShort(d){
  return d.toLocaleDateString('en-GB',{day:'numeric', month:'short'});
}
function dayKeyOf(d){
  return DAYS[(d.getDay()+6)%7] || null; // null for weekend
}
function weekTypeFor(d){
  const anchor = getMonday(fromISO(store.weekAnchor));
  const monday = getMonday(d);
  const diffWeeks = Math.round((monday - anchor) / (7*24*3600*1000));
  const isAnchorA = store.weekAnchorType === 'A';
  const isEven = ((diffWeeks % 2) + 2) % 2 === 0;
  const anchorIsThisType = isEven; // even offset => same type as anchor
  if(store.weekAnchorType==='A') return anchorIsThisType ? 'A' : 'B';
  return anchorIsThisType ? 'B' : 'A';
}
function classInfo(code){
  if(!code) return null;
  const override = store.classMeta[code];
  const base = DEFAULT_CLASSES[code] || {label:code, color:'slate'};
  return Object.assign({}, base, override||{});
}
function getSlot(weekType, day, periodKey){
  const override = store.timetableOverrides?.[weekType]?.[day]?.[periodKey];
  if(override !== undefined) return override; // includes explicit null (marked free)
  return DEFAULT_TIMETABLE[weekType][day][periodKey];
}
// Layers: a one-off daily override (cover, single room change) > the
// permanent weekly-pattern override > the default timetable.
function getSlotForDate(dateISO, periodKey){
  const dailyOv = store.dailyOverrides[dateISO+'_'+periodKey];
  if(dailyOv !== undefined) return dailyOv; // includes explicit null (marked free just for this date)
  const date = fromISO(dateISO);
  const dKey = dayKeyOf(date);
  if(!dKey) return null;
  return getSlot(weekTypeFor(date), dKey, periodKey);
}
function hasDailyOverride(dateISO, periodKey){
  return store.dailyOverrides[dateISO+'_'+periodKey] !== undefined;
}
function setDailyOverride(dateISO, periodKey, cls, room){
  const key = dateISO+'_'+periodKey;
  if(!cls && !room) store.dailyOverrides[key] = null;
  else store.dailyOverrides[key] = {class: cls, room: room};
  persist();
}
function clearDailyOverride(dateISO, periodKey){
  delete store.dailyOverrides[dateISO+'_'+periodKey];
  persist();
}
function lessonKey(dateISO, periodKey){ return dateISO+'_'+periodKey; }
function getLesson(dateISO, periodKey){
  return store.lessons[lessonKey(dateISO,periodKey)] || {title:'',notes:'',homework:''};
}
function setLesson(dateISO, periodKey, data){
  const key = lessonKey(dateISO,periodKey);
  const cleaned = {title:data.title||'', notes:data.notes||'', homework:data.homework||''};
  if(!cleaned.title && !cleaned.notes && !cleaned.homework){
    delete store.lessons[key];
  }else{
    store.lessons[key] = cleaned;
  }
  persist();
}
function allClassCodes(){
  const set = new Set(Object.keys(DEFAULT_CLASSES));
  Object.keys(store.classMeta).forEach(c=>set.add(c));
  return Array.from(set);
}
function weekOf(dateISO){
  return TERM_CALENDAR.find(w=>{
    const start = fromISO(w.wb);
    const end = addDays(start,6);
    const d = fromISO(dateISO);
    return d>=start && d<=end;
  });
}
// Meetings/CPD for one specific date, read straight off that date's real
// column in the source calendar table.
function dayEvents(dateISO){
  const date = fromISO(dateISO);
  const dKey = dayKeyOf(date);
  const wk = weekOf(dateISO);
  if(!wk || !dKey) return {items:[], isHoliday:false};
  if(wk.holiday) return {items:[], isHoliday:true, holidayLabel:wk.note};
  const items = wk.days[dKey] || [];
  const isHolidayDay = items.length===1 && items[0]==='Holiday';
  return {items: isHolidayDay? [] : items, isHoliday:isHolidayDay, holidayLabel:'Holiday'};
}
// Renders that date's actual meetings/CPD as a small read-only chip —
// used in the After School slot in Weekly and Daily views.
function dayAgendaChip(dateISO){
  const ev = dayEvents(dateISO);
  if(ev.isHoliday){
    return `<div class="agenda-chip agenda-holiday"><span class="agenda-title">${escapeHtml(ev.holidayLabel)}</span></div>`;
  }
  if(!ev.items.length) return '';
  return `<div class="agenda-chip">
    <span class="agenda-title">Today's meeting / CPD</span>
    <ul>${ev.items.map(e=>`<li>${escapeHtml(e)}</li>`).join('')}</ul>
  </div>`;
}

let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}
function debounce(fn, ms){
  let t; return function(...args){ clearTimeout(t); t=setTimeout(()=>fn.apply(this,args), ms); };
}

/* ======================================================================
   ROUTING / SHELL
   ====================================================================== */
const NAV = [
  {key:'dashboard', label:'Dashboard', icon:'dashboard'},
  {key:'weekly',    label:'Weekly Timetable', icon:'grid'},
  {key:'daily',     label:'Daily View', icon:'day'},
  {key:'calendar',  label:'Termly Calendar', icon:'calendar'},
  {key:'plans',     label:'Long-Term Plans', icon:'book'},
  {key:'settings',  label:'Settings', icon:'settings'}
];

let state = {
  route: 'dashboard',
  weekViewMonday: getMonday(new Date()),
  dailyDate: new Date(),
  planClass: null,
  editingTimetable: false
};

function navigate(route){
  state.route = route;
  render();
  window.scrollTo(0,0);
}

function renderSidebar(){
  const wrap = document.getElementById('nav-items');
  wrap.innerHTML = NAV.map(item=>`
    <button class="nav-item ${state.route===item.key?'active':''}" data-route="${item.key}">
      ${ICONS[item.icon]}<span>${item.label}</span>
    </button>
  `).join('');
  wrap.querySelectorAll('.nav-item').forEach(btn=>{
    btn.addEventListener('click', ()=>navigate(btn.dataset.route));
  });
}

function render(){
  renderSidebar();
  const main = document.getElementById('main');
  if(state.route==='dashboard') main.innerHTML = renderDashboard();
  else if(state.route==='weekly') main.innerHTML = renderWeekly();
  else if(state.route==='daily') main.innerHTML = renderDaily();
  else if(state.route==='calendar') main.innerHTML = renderCalendar();
  else if(state.route==='plans') main.innerHTML = renderPlans();
  else if(state.route==='settings') main.innerHTML = renderSettings();
  attachRouteHandlers();
}

/* ======================================================================
   DASHBOARD
   ====================================================================== */
function renderDashboard(){
  const today = new Date();
  const dKey = dayKeyOf(today);
  const wType = weekTypeFor(today);
  const todayISO = toISO(today);
  const isSchoolDay = !!dKey;

  let periodsHtml = '';
  if(isSchoolDay){
    periodsHtml = PERIODS.map(p=>{
      if(p.kind==='fixed'){
        return `<div class="period-fixed"><div class="period-time">${p.time}</div><div>${p.label}</div></div>`;
      }
      if(p.key==='after'){
        const text = store.afterSchool[todayISO] || '';
        return `<div class="period-row">
          <div class="period-time"><strong>${p.label}</strong>${p.time}</div>
          <div class="period-main">
            <div class="lesson-preview after-edit-trigger ${text?'':'empty'}" data-date="${todayISO}">
              ${text ? escapeHtml(text) : 'Tap to add a note for after school'}
            </div>
          </div>
        </div>`;
      }
      const slot = getSlotForDate(todayISO, p.key);
      const info = slot ? classInfo(slot.class) : null;
      const lesson = getLesson(todayISO, p.key);
      return `<div class="period-row">
        <div class="period-time"><strong>${p.label}</strong>${p.time}</div>
        <div class="period-main">
          <div class="period-class-line">
            ${info? `<span class="cc-dot cc-${info.color}"></span>`:''}
            <span class="period-class-name">${info? escapeHtml(info.label) : 'Free period'}</span>
            ${slot? `<span class="period-room pill pill-muted">${slot.room}</span>`:''}
          </div>
          ${slot ? `<div class="lesson-preview lesson-trigger ${lesson.title?'':'empty'}" data-date="${todayISO}" data-period="${p.key}">
            ${lesson.title ? escapeHtml(lesson.title) : 'Tap to add lesson content'}
          </div>` : `<div class="empty-note">Free — plan time or admin</div>`}
        </div>
      </div>`;
    }).join('');
  }

  const wk = weekOf(todayISO);
  const weekEventsHtml = wk ? renderWeekEventsList(wk) : `<div class="empty-note">No calendar data for this week.</div>`;

  return `
    <div class="page-head">
      <p class="page-eyebrow">${isSchoolDay? 'Today' : 'Weekend'} · Week ${wType}</p>
      <h1 class="page-title">${fmtLong(today)}</h1>
    </div>
    <div class="dash-grid">
      <div class="card" style="padding:20px 22px;">
        ${isSchoolDay ? periodsHtml : `<p class="empty-note">No timetabled lessons today. Enjoy the weekend, Andy.</p>`}
      </div>
      <div>
        <div class="card side-card">
          <h3>This week</h3>
          ${weekEventsHtml}
        </div>
        <div class="card side-card">
          <h3>Quick links</h3>
          <div style="display:flex;flex-direction:column;gap:8px;">
            <button class="btn btn-ghost" data-route="weekly" style="justify-content:flex-start;">View full week</button>
            <button class="btn btn-ghost" data-route="calendar" style="justify-content:flex-start;">Termly calendar</button>
            <button class="btn btn-ghost" data-route="plans" style="justify-content:flex-start;">Long-term plans</button>
          </div>
        </div>
      </div>
    </div>
  `;
}

function renderWeekEventsList(wk){
  if(wk.holiday){
    return `<div class="pill pill-brick">${escapeHtml(wk.note)}</div>`;
  }
  const dayLines = DAYS.map(d=>{
    const items = wk.days[d]||[];
    if(!items.length || (items.length===1 && items[0]==='Holiday')) return '';
    return `<li><strong>${d}:</strong> ${items.map(escapeHtml).join(' · ')}</li>`;
  }).join('');
  const tagLine = [...wk.sesi.map(s=>`<span class="pill pill-slate">${escapeHtml(s)}</span>`),
                    ...wk.arr.map(a=>`<span class="pill pill-gold">${escapeHtml(a)}</span>`)].join(' ');
  return `${wk.type?`<span class="pill pill-forest" style="margin-bottom:8px;">Week ${wk.type}</span>`:''}
  <ul style="margin:8px 0 0;padding-left:16px;font-size:13px;line-height:1.7;">
    ${dayLines || '<li class="empty-note">No meetings logged this week.</li>'}
  </ul>
  ${tagLine? `<div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:5px;">${tagLine}</div>` : ''}`;
}
function escapeHtml(s){
  return (s+'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ======================================================================
   WEEKLY TIMETABLE
   ====================================================================== */
function renderWeekly(){
  const monday = state.weekViewMonday;
  const wType = weekTypeFor(monday);
  const rangeStr = `${fmtShort(monday)} – ${fmtShort(addDays(monday,4))}`;
  const todayISO = toISO(new Date());

  const headRow = `<div class="tt-cell tt-head" style="border-right:none;"></div>` +
    DAYS.map((d,i)=>{
      const date = addDays(monday,i);
      const iso = toISO(date);
      const isToday = iso===todayISO;
      return `<div class="tt-cell tt-head" style="${isToday?'background:var(--gold-wash);':''}">
        <span class="dow">${DAY_FULL[d]}</span><span class="ddate">${fmtShort(date)}</span>
      </div>`;
    }).join('');

  const rows = PERIODS.map(p=>{
    if(p.kind==='fixed'){
      return `<div class="tt-cell tt-time-cell"><strong>${p.label}</strong>${p.time}</div>` +
        DAYS.map(()=>`<div class="tt-cell" style="background:#F1ECDF;min-height:30px;"></div>`).join('');
    }
    const timeCell = `<div class="tt-cell tt-time-cell"><strong>${p.label}</strong>${p.time}</div>`;
    const dayCells = DAYS.map((d,i)=>{
      const date = addDays(monday,i);
      const iso = toISO(date);
      const isToday = iso===todayISO;
      if(p.key==='after'){
        const text = store.afterSchool[iso]||'';
        const chip = dayAgendaChip(iso);
        return `<div class="tt-cell tt-lesson-cell ${isToday?'today-col':''}" data-after="1" data-date="${iso}">
          ${chip}
          <span class="${text?'':'empty'}">${text? escapeHtml(text).slice(0,60) : 'Add note'}</span>
        </div>`;
      }
      if(state.editingTimetable){
        const slot = getSlot(wType, d, p.key) || {class:'',room:''};
        return `<div class="tt-cell tt-edit-row" data-edit-day="${d}" data-edit-period="${p.key}">
          <input type="text" class="edit-class" placeholder="Class code" value="${escapeHtml(slot.class||'')}">
          <input type="text" class="edit-room" placeholder="Room" value="${escapeHtml(slot.room||'')}">
        </div>`;
      }
      const slot = getSlotForDate(iso, p.key);
      const overridden = hasDailyOverride(iso, p.key);
      if(!slot){
        return `<div class="tt-cell tt-lesson-cell empty ${isToday?'today-col':''}" data-lesson="1" data-date="${iso}" data-period="${p.key}">Free${overridden?' <span class=\"pill pill-gold\" style=\"margin-left:4px;\">•</span>':''}</div>`;
      }
      const info = classInfo(slot.class);
      const lesson = getLesson(iso, p.key);
      return `<div class="tt-cell tt-lesson-cell tt-cc-${info.color} ${isToday?'today-col':''}" data-lesson="1" data-date="${iso}" data-period="${p.key}">
        <span class="cname">${escapeHtml(info.label)}${overridden?' <span class="pill pill-gold" title="Changed for this date">•</span>':''}</span>
        <span class="croom">${slot.room}${slot.time?' · '+slot.time:''}</span>
        ${lesson.title? `<span class="cnote">${escapeHtml(lesson.title)}</span>`:''}
      </div>`;
    }).join('');
    return timeCell + dayCells;
  }).join('');

  return `
    <div class="page-head">
      <p class="page-eyebrow">Weekly Timetable</p>
      <h1 class="page-title">Week ${wType}</h1>
    </div>
    <div class="week-nav">
      <button class="icon-btn" id="wk-prev">${ICONS.chevL}</button>
      <span class="range">${rangeStr}</span>
      <button class="icon-btn" id="wk-next">${ICONS.chevR}</button>
      <button class="btn btn-sm" id="wk-today">This week</button>
      <span style="flex:1;"></span>
      <button class="btn btn-sm ${state.editingTimetable?'btn-primary':''}" id="wk-edit-toggle">
        ${state.editingTimetable? 'Done editing' : 'Edit timetable'}
      </button>
    </div>
    ${state.editingTimetable? `<p class="empty-note" style="margin:-10px 0 14px;">Editing Week ${wType} — changes apply to every Week ${wType} ${DAYS.map(d=>DAY_FULL[d]).join('/')} going forward. Leave a field blank for a free period.</p>` : ''}
    <div class="tt-scroll">
      <div class="tt-grid">${headRow}${rows}</div>
    </div>
  `;
}

/* ======================================================================
   DAILY VIEW
   ====================================================================== */
function renderDaily(){
  const date = state.dailyDate;
  const iso = toISO(date);
  const dKey = dayKeyOf(date);
  const wType = weekTypeFor(date);

  let body;
  if(!dKey){
    body = `<div class="card" style="padding:24px;"><p class="empty-note">No timetabled lessons on weekends.</p></div>`;
  }else{
    body = `<div class="card" style="padding:6px 22px;">` + PERIODS.map(p=>{
      if(p.kind==='fixed'){
        return `<div class="daily-fixed">${p.label} · ${p.time}</div>`;
      }
      if(p.key==='after'){
        const text = store.afterSchool[iso]||'';
        const chip = dayAgendaChip(iso);
        return `<div class="daily-period">
          <div class="daily-time-col"><div class="lbl">${p.label}</div><div class="tm">${p.time}</div></div>
          <div class="daily-body">
            ${chip? `<div class="daily-agenda">${chip}</div>` : ''}
            <textarea class="after-input" data-date="${iso}" rows="2" placeholder="Clubs, meetings, planning, detentions…">${escapeHtml(text)}</textarea>
          </div>
        </div>`;
      }
      const slot = getSlotForDate(iso, p.key);
      const info = slot ? classInfo(slot.class) : null;
      const lesson = getLesson(iso, p.key);
      const overridden = hasDailyOverride(iso, p.key);
      return `<div class="daily-period">
        <div class="daily-time-col"><div class="lbl">${p.label}</div><div class="tm">${p.time}</div></div>
        <div class="daily-body">
          <div class="daily-class-head slot-edit-row" data-date="${iso}" data-period="${p.key}">
            <input type="text" class="input slot-class" style="width:150px;" placeholder="Free period — class code" value="${escapeHtml(slot? slot.class:'')}">
            <input type="text" class="input slot-room" style="width:80px;" placeholder="Room" value="${escapeHtml(slot? slot.room:'')}">
            ${slot?.time? `<span class="pill pill-muted">${slot.time}</span>`:''}
            ${info? `<span class="pill pill-${info.color}">${escapeHtml(info.label)}</span>`:''}
            ${overridden? `<a href="#" class="slot-reset" data-date="${iso}" data-period="${p.key}" style="font-size:11.5px;color:var(--ink-soft);">reset</a>` : ''}
          </div>
          <div class="daily-fields">
            <div class="full"><label class="field-label">Lesson focus / title</label>
              <input class="input lesson-field" data-field="title" data-date="${iso}" data-period="${p.key}" value="${escapeHtml(lesson.title)}" placeholder="e.g. Integration by substitution">
            </div>
            <div class="full"><label class="field-label">Notes / activities</label>
              <textarea class="lesson-field" data-field="notes" data-date="${iso}" data-period="${p.key}" rows="3" placeholder="Key activities, resources, differentiation…">${escapeHtml(lesson.notes)}</textarea>
            </div>
            <div class="full"><label class="field-label">Homework / follow-up</label>
              <input class="input lesson-field" data-field="homework" data-date="${iso}" data-period="${p.key}" value="${escapeHtml(lesson.homework)}" placeholder="Set, due date…">
            </div>
          </div>
        </div>
      </div>`;
    }).join('') + `</div>`;
  }

  return `
    <div class="page-head">
      <p class="page-eyebrow">Daily View · Week ${wType}</p>
      <h1 class="page-title">${fmtLong(date)}</h1>
    </div>
    <div class="day-picker">
      <button class="icon-btn" id="day-prev">${ICONS.chevL}</button>
      <input type="date" class="input" id="day-pick" style="width:auto;" value="${iso}">
      <button class="icon-btn" id="day-next">${ICONS.chevR}</button>
      <button class="btn btn-sm" id="day-today">Today</button>
    </div>
    ${body}
  `;
}

/* ======================================================================
   TERMLY CALENDAR
   ====================================================================== */
function renderCalendar(){
  const todayISO = toISO(new Date());
  const cards = TERM_CALENDAR.map(wk=>{
    const start = fromISO(wk.wb);
    const end = addDays(start,4);
    const isCurrent = fromISO(todayISO) >= start && fromISO(todayISO) <= addDays(start,6);
    if(wk.holiday){
      return `<div class="card week-card holiday ${isCurrent?'current':''}">
        <div class="week-card-head"><span class="wb">${fmtShort(start)} – ${fmtShort(addDays(start,6))}</span><span class="pill pill-brick">${escapeHtml(wk.note)}</span></div>
      </div>`;
    }
    const dayRows = DAYS.map((d,i)=>{
      const items = wk.days[d]||[];
      if(!items.length) return '';
      const isHol = items.length===1 && items[0]==='Holiday';
      const date = addDays(start,i);
      return `<li><strong>${DAY_FULL[d]} ${fmtShort(date)}:</strong> ${isHol? '<span class="pill pill-brick">Holiday</span>' : items.map(escapeHtml).join(' · ')}</li>`;
    }).join('');
    const tagLine = [...wk.sesi.map(s=>`<span class="pill pill-slate">${escapeHtml(s)}</span>`),
                      ...wk.arr.map(a=>`<span class="pill pill-gold">${escapeHtml(a)}</span>`)].join(' ');
    return `<div class="card week-card ${isCurrent?'current':''}">
      <div class="week-card-head">
        <span class="wb">${fmtShort(start)} – ${fmtShort(end)}</span>
        ${wk.type? `<span class="pill pill-forest">Week ${wk.type}</span>`:''}
        ${isCurrent? `<span class="pill pill-gold">This week</span>`:''}
      </div>
      <ul>${dayRows || '<li class="empty-note">No meetings logged this week.</li>'}</ul>
      ${tagLine? `<div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:5px;">${tagLine}</div>` : ''}
    </div>`;
  }).join('');

  return `
    <div class="page-head">
      <p class="page-eyebrow">2026–27</p>
      <h1 class="page-title">Termly Calendar</h1>
    </div>
    <p class="empty-note" style="margin-top:-14px;margin-bottom:18px;">Read directly off the actual Mon–Fri columns in your CPD calendar. Grey/gold tags are the calendar's SESI and ARR columns, which the source doesn't pin to a specific day.</p>
    <div class="term-controls">
      <button class="btn btn-sm" id="cal-today">Jump to current week</button>
    </div>
    <div id="cal-list">${cards}</div>
  `;
}

/* ======================================================================
   LONG-TERM PLANS
   ====================================================================== */
const HALF_TERMS = ['Autumn 1','Autumn 2','Spring 1','Spring 2','Summer 1','Summer 2'];

function renderPlans(){
  const codes = allClassCodes().sort((a,b)=> classInfo(a).label.localeCompare(classInfo(b).label));
  if(!state.planClass || !codes.includes(state.planClass)) state.planClass = codes[0];
  const active = state.planClass;
  const info = classInfo(active);
  const planData = store.longTermPlans[active] || {};

  return `
    <div class="page-head">
      <p class="page-eyebrow">Long-Term Plans</p>
      <h1 class="page-title">Curriculum overview by class</h1>
    </div>
    <div class="class-tabs">
      ${codes.map(c=>`<button class="class-tab ${c===active?'active':''}" data-class="${c}"><span class="cc-dot cc-${classInfo(c).color}"></span> ${escapeHtml(classInfo(c).label)}</button>`).join('')}
    </div>
    <div class="card" style="padding:22px 24px;margin-bottom:20px;">
      <div style="display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-bottom:18px;">
        <div style="flex:1;min-width:200px;">
          <label class="field-label">Display name</label>
          <input class="input" id="class-label-input" value="${escapeHtml(info.label)}">
        </div>
        <div style="font-size:12.5px;color:var(--ink-soft);">Class code: <strong>${escapeHtml(active)}</strong></div>
      </div>
      ${HALF_TERMS.map(ht=>`
        <div class="plan-half">
          <label class="field-label">${ht}</label>
          <textarea class="input plan-field" data-half="${ht}" rows="3" placeholder="Topics, assessment points, key dates…">${escapeHtml((planData[ht]||''))}</textarea>
        </div>
      `).join('')}
    </div>
  `;
}

/* ======================================================================
   SETTINGS
   ====================================================================== */

    </div>

    <div class="card settings-block">
      <h3>Google Drive sync</h3>
      ${driveSignedIn ? `
        <p>Connected as <strong>${escapeHtml(driveEmail||'your Google account')}</strong>. Your data saves to a single file in your Drive, so it's available on any device you sign in on here.</p>
        <div class="row-flex">
          <button class="btn btn-primary" id="drive-sync-btn" ${driveBusy?'disabled':''}>${driveBusy? 'Syncing…' : 'Sync now'}</button>
          <button class="btn btn-ghost" id="drive-signout-btn">Disconnect</button>
        </div>
      ` : `
        <p>Sign in to save your planner to your own Google Drive automatically, and pick it up on any other device by signing in there too.</p>
        <button class="btn btn-primary" id="drive-signin-btn" ${driveBusy?'disabled':''}>${driveBusy? 'Connecting…' : 'Sign in with Google'}</button>
      `}
    </div>

    <div class="card settings-block">
      <h3>How saving works</h3>
      <p>Everything you type is also saved straight away to this browser's storage on this device, so nothing is lost even offline. With Google Drive connected above, it syncs there too — otherwise it stays on this device only.</p>
    </div>

    <div class="card settings-block">
      <h3>Export your data</h3>
      <p>Downloads a single file with every lesson note, long-term plan and timetable edit — handy as a one-off backup or to move devices manually.</p>
      <button class="btn btn-primary" id="export-btn">Download backup (.json)</button>
    </div>

    <div class="card settings-block">
      <h3>Import data</h3>
      <p>Choose a backup file to load it into this browser. This will <strong>replace</strong> what's currently saved here.</p>
      <input type="file" id="import-file" accept="application/json">
    </div>

    <div class="card settings-block">
      <h3>Reset</h3>
      <p>Clears all lesson notes, plans and timetable edits from this browser and starts fresh. This does not delete your file in Google Drive.</p>
      <button class="btn btn-danger" id="reset-btn">Reset all data</button>
    </div>
  `;
}

/* ======================================================================
   LESSON MODAL
   ====================================================================== */
function openLessonModal(dateISO, periodKey){
  const date = fromISO(dateISO);
  const period = PERIODS.find(p=>p.key===periodKey);
  const slot = getSlotForDate(dateISO, periodKey);
  const info = slot ? classInfo(slot.class) : null;
  const lesson = getLesson(dateISO, periodKey);
  const overridden = hasDailyOverride(dateISO, periodKey);

  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal">
        <div class="modal-head">
          <div>
            <h3>${info? escapeHtml(info.label) : 'Free period'}</h3>
            <div class="sub">${fmtLong(date)} · ${period.label} (${period.time})</div>
          </div>
          <button class="icon-btn" id="modal-close">${ICONS.close}</button>
        </div>
        <div class="field-group" style="display:flex;gap:10px;">
          <div style="flex:1;">
            <label class="field-label">Class code</label>
            <input class="input" id="m-class" value="${escapeHtml(slot? slot.class:'')}" placeholder="e.g. 13A/Ma">
          </div>
          <div style="width:110px;">
            <label class="field-label">Room</label>
            <input class="input" id="m-room" value="${escapeHtml(slot? slot.room:'')}" placeholder="e.g. D2">
          </div>
        </div>
        ${overridden? `<p class="empty-note" style="margin:-8px 0 14px;">Changed just for this date. <a href="#" id="m-reset-slot" style="color:var(--forest);">Reset to normal timetable</a></p>` : ''}
        <div class="field-group">
          <label class="field-label">Lesson focus / title</label>
          <input class="input" id="m-title" value="${escapeHtml(lesson.title)}" placeholder="e.g. Trig identities — proof">
        </div>
        <div class="field-group">
          <label class="field-label">Notes / activities</label>
          <textarea class="input" id="m-notes" rows="4" placeholder="Key activities, resources, differentiation…">${escapeHtml(lesson.notes)}</textarea>
        </div>
        <div class="field-group">
          <label class="field-label">Homework / follow-up</label>
          <input class="input" id="m-hw" value="${escapeHtml(lesson.homework)}" placeholder="Set, due date…">
        </div>
        <div class="modal-actions">
          <button class="btn btn-ghost" id="modal-open-day">Open full day view</button>
          <button class="btn btn-primary" id="modal-save">Save</button>
        </div>
      </div>
    </div>
  `;
  const close = ()=>{ root.innerHTML=''; };
  document.getElementById('modal-close').onclick = close;
  document.getElementById('modal-overlay').addEventListener('click', e=>{ if(e.target.id==='modal-overlay') close(); });
  const resetLink = document.getElementById('m-reset-slot');
  if(resetLink) resetLink.onclick = (e)=>{ e.preventDefault(); clearDailyOverride(dateISO, periodKey); openLessonModal(dateISO, periodKey); };
  document.getElementById('modal-save').onclick = ()=>{
    const newClass = document.getElementById('m-class').value.trim();
    const newRoom = document.getElementById('m-room').value.trim();
    const baseline = (()=>{ const d=dayKeyOf(date); return d? getSlot(weekTypeFor(date), d, periodKey) : null; })();
    const baselineClass = baseline? baseline.class : '';
    const baselineRoom = baseline? baseline.room : '';
    if(newClass!==baselineClass || newRoom!==baselineRoom){
      setDailyOverride(dateISO, periodKey, newClass, newRoom);
    }else if(overridden){
      clearDailyOverride(dateISO, periodKey);
    }
    setLesson(dateISO, periodKey, {
      title: document.getElementById('m-title').value,
      notes: document.getElementById('m-notes').value,
      homework: document.getElementById('m-hw').value
    });
    showToast('Lesson saved');
    close();
    render();
  };
  document.getElementById('modal-open-day').onclick = ()=>{
    close();
    state.dailyDate = date;
    navigate('daily');
  };
}

function openAfterModal(dateISO){
  const date = fromISO(dateISO);
  const root = document.getElementById('modal-root');
  const text = store.afterSchool[dateISO] || '';
  root.innerHTML = `
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal">
        <div class="modal-head">
          <div><h3>After School</h3><div class="sub">${fmtLong(date)}</div></div>
          <button class="icon-btn" id="modal-close">${ICONS.close}</button>
        </div>
        <div class="field-group">
          <textarea class="input" id="m-after" rows="4" placeholder="Clubs, meetings, planning, detentions…">${escapeHtml(text)}</textarea>
        </div>
        <div class="modal-actions">
          <span></span>
          <button class="btn btn-primary" id="modal-save-after">Save</button>
        </div>
      </div>
    </div>
  `;
  const close = ()=>{ root.innerHTML=''; };
  document.getElementById('modal-close').onclick = close;
  document.getElementById('modal-overlay').addEventListener('click', e=>{ if(e.target.id==='modal-overlay') close(); });
  document.getElementById('modal-save-after').onclick = ()=>{
    const v = document.getElementById('m-after').value;
    if(v.trim()) store.afterSchool[dateISO]=v; else delete store.afterSchool[dateISO];
    persist();
    close();
    render();
  };
}

/* ======================================================================
   EVENT WIRING PER ROUTE
   ====================================================================== */
function attachRouteHandlers(){
  document.querySelectorAll('[data-route]').forEach(el=>{
    el.addEventListener('click', ()=>navigate(el.dataset.route));
  });

  if(state.route==='dashboard'){
    document.querySelectorAll('.lesson-trigger').forEach(el=>{
      el.addEventListener('click', ()=>openLessonModal(el.dataset.date, el.dataset.period));
    });
    document.querySelectorAll('.after-edit-trigger').forEach(el=>{
      el.addEventListener('click', ()=>openAfterModal(el.dataset.date));
    });
  }

  if(state.route==='weekly'){
    document.getElementById('wk-prev').onclick = ()=>{ state.weekViewMonday = addDays(state.weekViewMonday,-7); render(); };
    document.getElementById('wk-next').onclick = ()=>{ state.weekViewMonday = addDays(state.weekViewMonday,7); render(); };
    document.getElementById('wk-today').onclick = ()=>{ state.weekViewMonday = getMonday(new Date()); render(); };
    document.getElementById('wk-edit-toggle').onclick = ()=>{
      if(state.editingTimetable){
        saveTimetableEdits();
      }
      state.editingTimetable = !state.editingTimetable;
      render();
    };
    document.querySelectorAll('[data-lesson]').forEach(el=>{
      el.addEventListener('click', ()=>openLessonModal(el.dataset.date, el.dataset.period));
    });
    document.querySelectorAll('[data-after]').forEach(el=>{
      el.addEventListener('click', ()=>openAfterModal(el.dataset.date));
    });
  }

  if(state.route==='daily'){
    document.getElementById('day-prev').onclick = ()=>{ state.dailyDate = addDays(state.dailyDate,-1); render(); };
    document.getElementById('day-next').onclick = ()=>{ state.dailyDate = addDays(state.dailyDate,1); render(); };
    document.getElementById('day-today').onclick = ()=>{ state.dailyDate = new Date(); render(); };
    document.getElementById('day-pick').onchange = (e)=>{ state.dailyDate = fromISO(e.target.value); render(); };

    document.querySelectorAll('.slot-edit-row').forEach(row=>{
      const dateISO = row.dataset.date, periodKey = row.dataset.period;
      const classInput = row.querySelector('.slot-class');
      const roomInput = row.querySelector('.slot-room');
      const saveSlot = debounce(()=>{
        setDailyOverride(dateISO, periodKey, classInput.value.trim(), roomInput.value.trim());
        if(!row.querySelector('.slot-reset')){
          const a = document.createElement('a');
          a.href = '#'; a.className = 'slot-reset'; a.textContent = 'reset';
          a.dataset.date = dateISO; a.dataset.period = periodKey;
          a.style.cssText = 'font-size:11.5px;color:var(--ink-soft);';
          a.addEventListener('click', (e)=>{ e.preventDefault(); clearDailyOverride(dateISO, periodKey); render(); });
          row.appendChild(a);
        }
      }, 500);
      classInput.addEventListener('input', saveSlot);
      roomInput.addEventListener('input', saveSlot);
    });
    document.querySelectorAll('.slot-reset').forEach(el=>{
      el.addEventListener('click', (e)=>{
        e.preventDefault();
        clearDailyOverride(el.dataset.date, el.dataset.period);
        render();
      });
    });

    document.querySelectorAll('.lesson-field').forEach(el=>{
      el.addEventListener('input', debounce(()=>{
        const dateISO = el.dataset.date, periodKey = el.dataset.period;
        const titleEl = document.querySelector(`.lesson-field[data-date="${dateISO}"][data-period="${periodKey}"][data-field="title"]`);
        const notesEl = document.querySelector(`.lesson-field[data-date="${dateISO}"][data-period="${periodKey}"][data-field="notes"]`);
        const hwEl = document.querySelector(`.lesson-field[data-date="${dateISO}"][data-period="${periodKey}"][data-field="homework"]`);
        setLesson(dateISO, periodKey, {title: titleEl?titleEl.value:'', notes: notesEl?notesEl.value:'', homework: hwEl?hwEl.value:''});
      }, 500));
    });
    document.querySelectorAll('.after-input').forEach(el=>{
      el.addEventListener('input', debounce(()=>{
        const v = el.value;
        if(v.trim()) store.afterSchool[el.dataset.date]=v; else delete store.afterSchool[el.dataset.date];
        persist();
      }, 500));
    });
  }

  if(state.route==='calendar'){
    document.getElementById('cal-today').onclick = ()=>{
      const el = document.querySelector('.week-card.current');
      if(el) el.scrollIntoView({behavior:'smooth', block:'center'});
      else showToast('Current week not found in calendar range.');
    };
  }

  if(state.route==='plans'){
    document.querySelectorAll('.class-tab').forEach(el=>{
      el.addEventListener('click', ()=>{ state.planClass = el.dataset.class; render(); });
    });
    const labelInput = document.getElementById('class-label-input');
    if(labelInput){
      labelInput.addEventListener('input', debounce(()=>{
        const code = state.planClass;
        const base = classInfo(code);
        store.classMeta[code] = Object.assign({}, base, {label: labelInput.value});
        persist();
      }, 400));
    }
    document.querySelectorAll('.plan-field').forEach(el=>{
      el.addEventListener('input', debounce(()=>{
        const code = state.planClass;
        const half = el.dataset.half;
        if(!store.longTermPlans[code]) store.longTermPlans[code] = {};
        store.longTermPlans[code][half] = el.value;
        persist();
      }, 400));
    });
  }

  if(state.route==='settings'){
    document.getElementById('export-btn').onclick = exportData;
    document.getElementById('import-file').onchange = importData;
    document.getElementById('reset-btn').onclick = ()=>{
      if(confirm('This will permanently erase all saved lesson notes, plans and timetable edits from this browser. Continue?')){
        store = defaultStore();
        persist();
        showToast('All data reset.');
        navigate('dashboard');
      }
    };
    const signinBtn = document.getElementById('drive-signin-btn');
    if(signinBtn) signinBtn.onclick = driveSignIn;
    const syncBtn = document.getElementById('drive-sync-btn');
    if(syncBtn) syncBtn.onclick = ()=>driveSyncNow(false);
    const signoutBtn = document.getElementById('drive-signout-btn');
    if(signoutBtn) signoutBtn.onclick = driveSignOut;
  }
}

function saveTimetableEdits(){
  document.querySelectorAll('[data-edit-day]').forEach(cell=>{
    const day = cell.dataset.editDay, periodKey = cell.dataset.editPeriod;
    const cls = cell.querySelector('.edit-class').value.trim();
    const room = cell.querySelector('.edit-room').value.trim();
    const wType = weekTypeFor(state.weekViewMonday);
    if(!store.timetableOverrides[wType]) store.timetableOverrides[wType] = {};
    if(!store.timetableOverrides[wType][day]) store.timetableOverrides[wType][day] = {};
    if(!cls && !room){
      store.timetableOverrides[wType][day][periodKey] = null;
    }else{
      store.timetableOverrides[wType][day][periodKey] = {class: cls, room: room};
    }
  });
  persist();
  showToast('Timetable updated');
}

/* ======================================================================
   EXPORT / IMPORT
   ====================================================================== */
function exportData(){
  const blob = new Blob([JSON.stringify(store, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `andy-brooks-planner-backup-${toISO(new Date())}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Backup downloaded');
}
function importData(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      if(!confirm('Import this backup? It will replace all data currently saved in this browser.')) return;
      store = Object.assign(defaultStore(), parsed);
      persist();
      showToast('Backup imported');
      navigate('dashboard');
    }catch(err){
      alert('That file could not be read as a planner backup.');
    }
  };
  reader.readAsText(file);
}

/* ======================================================================
   AUTO-HIDING NAV — hides the sidebar / top bar on scroll-down, reveals
   it again on scroll-up (or via the small reveal button), so the content
   area gets more room while reading a long page.
   ====================================================================== */
(function initAutoHideNav(){
  let lastY = window.scrollY;
  const THRESHOLD = 10;   // ignore tiny scroll jitter
  const TOP_ZONE = 60;    // always show near the very top of the page
  window.addEventListener('scroll', ()=>{
    const y = window.scrollY;
    if(y < TOP_ZONE){
      document.body.classList.remove('nav-hidden');
    }else if(y - lastY > THRESHOLD){
      document.body.classList.add('nav-hidden');
    }else if(lastY - y > THRESHOLD){
      document.body.classList.remove('nav-hidden');
    }
    lastY = y;
  }, {passive:true});
  document.getElementById('nav-reveal').addEventListener('click', ()=>{
    document.body.classList.remove('nav-hidden');
  });
})();

/* ======================================================================
   GOOGLE DRIVE SYNC
   Saves the planner's data as one JSON file in the signed-in user's own
   Google Drive (created and owned by them — this app can only see the
   one file it creates, nothing else in their Drive).
   ====================================================================== */
const GOOGLE_CLIENT_ID = '906248134114-q0kkee9cntkjttl9laickus81s4reaf4.apps.googleusercontent.com';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
const DRIVE_FILENAME = 'andy-brooks-planner-data.json';

let gTokenClient = null;
let gAccessToken = null;
let driveFileId = localStorage.getItem('plannerDriveFileId') || null;
let driveSignedIn = false;
let driveEmail = localStorage.getItem('plannerDriveEmail') || '';
let driveBusy = false;

function waitForGoogleIdentity(cb, tries){
  tries = tries||0;
  if(window.google && google.accounts && google.accounts.oauth2){ cb(); return; }
  if(tries>75){ console.warn('Google Identity Services did not load.'); return; }
  setTimeout(()=>waitForGoogleIdentity(cb, tries+1), 200);
}

function driveInit(){
  waitForGoogleIdentity(()=>{
    gTokenClient = google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID,
      scope: DRIVE_SCOPE,
      callback: (resp)=>{
        driveBusy = false;
        if(resp.error){
          driveSignedIn = false;
          if(state.route==='settings') render();
          return;
        }
        gAccessToken = resp.access_token;
        driveSignedIn = true;
        localStorage.setItem('plannerDriveConnected','1');
        fetchDriveProfile().then(()=>driveSyncNow(true));
      }
    });
    if(localStorage.getItem('plannerDriveConnected')==='1'){
      driveBusy = true;
      gTokenClient.requestAccessToken({prompt:''});
    }
  });
}
function driveSignIn(){
  if(!gTokenClient){ showToast('Still loading Google sign-in — try again in a moment.'); return; }
  driveBusy = true;
  gTokenClient.requestAccessToken({prompt:'consent'});
  if(state.route==='settings') render();
}
function driveSignOut(){
  if(gAccessToken) google.accounts.oauth2.revoke(gAccessToken, ()=>{});
  driveSignedIn = false; gAccessToken = null; driveEmail='';
  localStorage.removeItem('plannerDriveConnected');
  localStorage.removeItem('plannerDriveEmail');
  showToast('Disconnected from Google Drive');
  if(state.route==='settings') render();
}
async function fetchDriveProfile(){
  try{
    const res = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {headers:{'Authorization':'Bearer '+gAccessToken}});
    const data = await res.json();
    driveEmail = data.email || '';
    localStorage.setItem('plannerDriveEmail', driveEmail);
  }catch(e){ /* non-essential */ }
}
function driveHeaders(extra){
  return Object.assign({'Authorization':'Bearer '+gAccessToken}, extra||{});
}
async function driveFindFile(){
  const q = encodeURIComponent(`name='${DRIVE_FILENAME}' and trashed=false`);
  const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,name)`, {headers:driveHeaders()});
  const data = await res.json();
  if(data.files && data.files.length){
    driveFileId = data.files[0].id;
    localStorage.setItem('plannerDriveFileId', driveFileId);
    return driveFileId;
  }
  return null;
}
async function driveCreateFile(content){
  const boundary = 'plannerBoundary';
  const metadata = {name: DRIVE_FILENAME, mimeType:'application/json'};
  const body =
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n`+
    `--${boundary}\r\nContent-Type: application/json\r\n\r\n${content}\r\n`+
    `--${boundary}--`;
  const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
    method:'POST',
    headers: driveHeaders({'Content-Type':`multipart/related; boundary=${boundary}`}),
    body
  });
  const data = await res.json();
  driveFileId = data.id;
  localStorage.setItem('plannerDriveFileId', driveFileId);
}
async function driveUpload(content){
  if(!driveFileId){
    const found = await driveFindFile();
    if(!found){ await driveCreateFile(content); return; }
  }
  const res = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=media`, {
    method:'PATCH',
    headers: driveHeaders({'Content-Type':'application/json'}),
    body: content
  });
  if(res.status===404){ driveFileId=null; localStorage.removeItem('plannerDriveFileId'); await driveCreateFile(content); }
}
async function driveDownload(){
  if(!driveFileId){
    const found = await driveFindFile();
    if(!found) return null;
  }
  const res = await fetch(`https://www.googleapis.com/drive/v3/files/${driveFileId}?alt=media`, {headers:driveHeaders()});
  if(!res.ok) return null;
  return await res.text();
}
async function driveSyncNow(silent){
  if(!gAccessToken){ if(!silent) showToast('Not signed in to Google.'); return; }
  driveBusy = true;
  if(state.route==='settings') render();
  try{
    const remoteText = await driveDownload();
    if(remoteText){
      const remote = JSON.parse(remoteText);
      const remoteTime = remote.lastModified||0;
      const localTime = store.lastModified||0;
      if(remoteTime > localTime){
        store = Object.assign(defaultStore(), remote);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
        showToast('Loaded the latest version from Google Drive');
        render();
      }else if(localTime > remoteTime){
        await driveUpload(JSON.stringify(store));
        showToast('Backed up to Google Drive');
      }else if(!silent){
        showToast('Already up to date');
      }
    }else{
      await driveUpload(JSON.stringify(store));
      showToast('Backed up to Google Drive');
    }
  }catch(err){
    console.error(err);
    if(!silent) showToast('Drive sync failed — check your connection and try again.');
  }
  driveBusy = false;
  if(state.route==='settings') render();
}

/* ======================================================================
   INIT
   ====================================================================== */
render();
driveInit();
</script>
