function renderWeekly(){
  const monday = state.weekViewMonday;
  const wType = weekTypeFor(monday);
  const rangeStr = `${fmtShort(monday)} – ${fmtShort(addDays(monday,4))}`;
  const todayISO = toISO(new Date());

  const headRow = `<div class="tt-cell tt-head" style="border-right:none;"></div>` +
    DAYS.map((d,i)=>{
      const date = addDays(monday,i);
      const iso = toISO(date);
      const isToday = iso===todayISO;
      return `<div class="tt-cell tt-head" style="${isToday?'background:var(--gold-wash);':''}">
        <span class="dow">${DAY_FULL[d]}</span><span class="ddate">${fmtShort(date)}</span>
      </div>`;
    }).join('');

  const rows = PERIODS.map(p=>{
    if(p.kind==='fixed'){
      return `<div class="tt-cell tt-time-cell"><strong>${p.label}</strong>${p.time}</div>` +
        DAYS.map((d,i)=>{
          if(state.editingTimetable) return `<div class="tt-cell tt-fixed-cell">${activityEditor(wType, d, p.key)}</div>`;
          return `<div class="tt-cell tt-fixed-cell">${activityChip(activityFor(toISO(addDays(monday,i)), p.key), true)}</div>`;
        }).join('');
    }
    const timeCell = `<div class="tt-cell tt-time-cell"><strong>${p.label}</strong>${p.time}</div>`;
    const dayCells = DAYS.map((d,i)=>{
      const date = addDays(monday,i);
      const iso = toISO(date);
      const isToday = iso===todayISO;
      if(p.key==='after' && state.editingTimetable){
        return `<div class="tt-cell">${activityEditor(wType, d, 'after')}</div>`;
      }
      if(p.key==='after'){
        const text = store.afterSchool[iso]||'';
        const chip = dayAgendaChip(iso);
        return `<div class="tt-cell tt-lesson-cell ${isToday?'today-col':''}" data-after="1" data-date="${iso}">
          ${activityChip(activityFor(iso,'after'), true)}
          ${chip}
          <span class="${text?'':'empty'}">${text? escapeHtml(text).slice(0,60) : 'Add note'}</span>
        </div>`;
      }
      if(state.editingTimetable){
        const slot = getSlot(wType, d, p.key) || {class:'',room:''};
        return `<div class="tt-cell tt-edit-row" data-edit-day="${d}" data-edit-period="${p.key}">
          <input type="text" class="edit-class" placeholder="Class code" value="${escapeHtml(slot.class||'')}">
          <input type="text" class="edit-room" placeholder="Room" value="${escapeHtml(slot.room||'')}">
        </div>`;
      }
      const slot = getSlotForDate(iso, p.key);
      const overridden = hasDailyOverride(iso, p.key);
      if(!slot){
        const freeLesson = getLesson(iso, p.key);
        return `<div class="tt-cell tt-lesson-cell ${freeLesson.title?'':'empty'} ${isToday?'today-col':''}" data-lesson="1" data-date="${iso}" data-period="${p.key}">
          <span class="cname" style="${freeLesson.title?'':'color:var(--ink-faint);font-weight:500;'}">Free${overridden?' <span class="pill pill-gold" style="margin-left:4px;">•</span>':''}</span>
          ${freeLesson.title? `<span class="cnote">${escapeHtml(freeLesson.title)}</span>`:''}
        </div>`;
      }
      const info = classInfo(slot.class);
      // Second half of a double: the first half's cell already spans this row.
      const asSecondOf = DOUBLE_PAIRS.find(([a,b])=>b===p.key);
      if(asSecondOf && isDoubleSlots(getSlotForDate(iso, asSecondOf[0]), slot)) return '';
      const partnerKey = pairPartnerKey(p.key);
      const partnerSlot = partnerKey ? getSlotForDate(iso, partnerKey) : null;
      const isDbl = isDoubleSlots(slot, partnerSlot);
      if(isDbl) adoptPartnerLesson(iso, p.key, partnerKey);
      const partnerPeriod = isDbl ? PERIODS.find(pp=>pp.key===partnerKey) : null;
      const room = isDbl ? doubleRoom(slot, partnerSlot) : slot.room;
      const time = isDbl ? (slot.time || p.time.split('–')[0]+'–'+partnerPeriod.time.split('–')[1]) : slot.time;
      const lesson = getLesson(iso, p.key);
      return `<div class="tt-cell tt-lesson-cell tt-cc-${info.color} ${isToday?'today-col':''}" ${isDbl?'style="grid-row:span 2;"':''} data-lesson="1" data-date="${iso}" data-period="${p.key}">
        <span class="cname">${escapeHtml(info.label)}${overridden?' <span class="pill pill-gold" title="Changed for this date">•</span>':''}</span>
        <span class="croom">${escapeHtml(room||'')}${time?' · '+time:''}${isDbl?' · Double':''}</span>
        ${hwTagForLesson(iso, slot.class, p.key)}
        ${lesson.title? `<span class="cnote">${escapeHtml(lesson.title)}</span>`:''}
      </div>`;
    }).join('');
    return timeCell + dayCells;
  }).join('');

  return `
    <div class="page-head">
      <p class="page-eyebrow">Weekly Timetable</p>
      <h1 class="page-title">Week ${wType}</h1>
    </div>
    <div class="week-nav">
      <button class="icon-btn" id="wk-prev">${ICONS.chevL}</button>
      <span class="range">${rangeStr}</span>
      <button class="icon-btn" id="wk-next">${ICONS.chevR}</button>
      <button class="btn btn-sm" id="wk-today">This week</button>
      <span style="flex:1;"></span>
      <button class="btn btn-sm ${state.editingTimetable?'btn-primary':''}" id="wk-edit-toggle">
        ${state.editingTimetable? 'Done editing' : 'Edit timetable'}
      </button>
    </div>
    ${state.editingTimetable? `<p class="empty-note" style="margin:-10px 0 14px;">Editing Week ${wType} — changes apply to every Week ${wType} ${DAYS.map(d=>DAY_FULL[d]).join('/')} going forward. Leave a field blank for a free period. Use Break, Lunch and After School to add duties, commutes and clubs; they'll show every Week ${wType} automatically.</p>` : ''}
    <div class="tt-scroll">
      <div class="tt-grid wk-grid">${headRow}${rows}</div>
    </div>
    ${renderTodoCard('week', toISO(monday), 'todo-card-wide')}
  `;
}

/* ======================================================================
   DAILY VIEW
   ====================================================================== */
function renderDaily(){
  const date = state.dailyDate;
  const iso = toISO(date);
  const dKey = dayKeyOf(date);
  const wType = weekTypeFor(date);

  let body;
  if(!dKey){
    body = `<div class="card" style="padding:24px;"><p class="empty-note">No timetabled lessons on weekends.</p></div>`;
  }else{
    body = `<div class="card" style="padding:6px 22px;">` + computeDayRows(iso).map(row=>{
      if(row.type==='fixed'){
        const p = row.period;
        return `<div class="daily-fixed">${p.label} · ${p.time}${activityChip(activityFor(iso, p.key))}</div>`;
      }
      if(row.type==='after'){
        const p = row.period;
        const text = store.afterSchool[iso]||'';
        const chip = dayAgendaChip(iso);
        return `<div class="daily-period">
          <div class="daily-time-col"><div class="lbl">${p.label}</div><div class="tm">${p.time}</div></div>
          <div class="daily-body">
            ${activityFor(iso,'after')? `<div class="after-acts">${activityChip(activityFor(iso,'after'))}</div>` : ''}
            ${chip? `<div class="daily-agenda">${chip}</div>` : ''}
            <textarea class="after-input" data-date="${iso}" rows="2" placeholder="Clubs, meetings, planning, detentions…">${escapeHtml(text)}</textarea>
          </div>
        </div>`;
      }
      const isDouble = row.type==='double';
      const label = isDouble ? row.label : row.period.label;
      const time = isDouble ? row.time : row.period.time;
      const periodKey = isDouble ? row.periodA.key : row.period.key;
      const partnerKey = isDouble ? row.periodB.key : '';
      const slot = row.slot;
      const info = slot ? classInfo(slot.class) : null;
      const lesson = getLesson(iso, periodKey);
      const overridden = isDouble ? (hasDailyOverride(iso, periodKey) || hasDailyOverride(iso, partnerKey)) : hasDailyOverride(iso, periodKey);
      return `<div class="daily-period">
        <div class="daily-time-col"><div class="lbl">${label}</div><div class="tm">${time}</div></div>
        <div class="daily-body">
          <div class="daily-class-head slot-edit-row" data-date="${iso}" data-period="${periodKey}" data-partner="${partnerKey}" data-combined-time="${time}">
            <input type="text" class="input slot-class" style="width:150px;" placeholder="Free period — class code" value="${escapeHtml(slot? slot.class:'')}">
            <input type="text" class="input slot-room" style="width:80px;" placeholder="Room" value="${escapeHtml(slot? slot.room:'')}">
            ${info? `<span class="pill pill-${info.color}">${escapeHtml(info.label)}</span>`:''}
            ${overridden? `<a href="#" class="slot-reset" data-date="${iso}" data-period="${periodKey}" data-partner="${partnerKey}" style="font-size:11.5px;color:var(--ink-soft);">reset</a>` : ''}
          </div>
          ${slot? hwInlineForLesson(iso, slot.class, periodKey, true) : ''}
          <div class="daily-fields">
            <div class="full"><label class="field-label">Lesson focus / title</label>
              <input class="input lesson-field" data-field="title" data-date="${iso}" data-period="${periodKey}" value="${escapeHtml(lesson.title)}" placeholder="e.g. Integration by substitution">
            </div>
            <div class="full"><label class="field-label">Notes / activities</label>
              <textarea class="lesson-field" data-field="notes" data-date="${iso}" data-period="${periodKey}" rows="3" placeholder="Key activities, resources, differentiation…">${escapeHtml(lesson.notes)}</textarea>
            </div>
          </div>
        </div>
      </div>`;
    }).join('') + `</div>`;
  }

  return `
    <div class="page-head">
      <p class="page-eyebrow">Daily View · Week ${wType}</p>
      <h1 class="page-title">${fmtLong(date)}</h1>
    </div>
    <div class="day-picker">
      <button class="icon-btn" id="day-prev">${ICONS.chevL}</button>
      <input type="date" class="input" id="day-pick" style="width:auto;" value="${iso}">
      <button class="icon-btn" id="day-next">${ICONS.chevR}</button>
      <button class="btn btn-sm" id="day-today">Today</button>
    </div>
    ${renderTodoCard('day', iso, 'todo-card-daily')}
    ${body}
  `;
}

/* ======================================================================
   TERMLY CALENDAR
   ====================================================================== */
function renderCalendar(){
  const todayISO = toISO(new Date());
  function buildDayLine(dateISO, dayLabel, builtInItems){
    const isHol = builtInItems.length===1 && builtInItems[0]==='Holiday';
    const custom = store.customEvents[dateISO]||[];
    const parts = [];
    if(isHol) parts.push('<span class="pill pill-brick">Holiday</span>');
    else if(builtInItems.length) parts.push(builtInItems.map(escapeHtml).join(' · '));
    custom.forEach((c,idx)=>{
      parts.push(`<span class="custom-event-tag">${escapeHtml(c)} <a href="#" class="cal-del-event" data-date="${dateISO}" data-idx="${idx}" title="Remove this">×</a></span>`);
    });
    if(!parts.length) return '';
    return `<li><strong>${dayLabel}:</strong> ${parts.join(' · ')}</li>`;
  }
  const cards = TERM_CALENDAR.map(wk=>{
    const start = fromISO(wk.wb);
    const end = addDays(start,4);
    const isCurrent = fromISO(todayISO) >= start && fromISO(todayISO) <= addDays(start,6);
    if(wk.holiday){
      const dayRows = DAYS.map((d,i)=>buildDayLine(toISO(addDays(start,i)), `${DAY_FULL[d]} ${fmtShort(addDays(start,i))}`, [])).join('');
      return `<div class="card week-card holiday ${isCurrent?'current':''}">
        <div class="week-card-head"><span class="wb">${fmtShort(start)} – ${fmtShort(addDays(start,6))}</span><span class="pill pill-brick">${escapeHtml(wk.note)}</span></div>
        ${dayRows? `<ul>${dayRows}</ul>` : ''}
      </div>`;
    }
    const dayRows = DAYS.map((d,i)=>buildDayLine(toISO(addDays(start,i)), `${DAY_FULL[d]} ${fmtShort(addDays(start,i))}`, wk.days[d]||[])).join('');
    const tagLine = [...wk.sesi.map(s=>`<span class="pill pill-slate">${escapeHtml(s)}</span>`),
                      ...wk.arr.map(a=>`<span class="pill pill-gold">${escapeHtml(a)}</span>`)].join(' ');
    return `<div class="card week-card ${isCurrent?'current':''}">
      <div class="week-card-head">
        <span class="wb">${fmtShort(start)} – ${fmtShort(end)}</span>
        ${wk.type? `<span class="pill pill-forest">Week ${wk.type}</span>`:''}
        ${isCurrent? `<span class="pill pill-gold">This week</span>`:''}
      </div>
      <ul>${dayRows || '<li class="empty-note">No meetings logged this week.</li>'}</ul>
      ${tagLine? `<div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:5px;">${tagLine}</div>` : ''}
    </div>`;
  }).join('');

  const coveredDates = new Set();
  TERM_CALENDAR.forEach(wk=>{ const s=fromISO(wk.wb); for(let i=0;i<7;i++) coveredDates.add(toISO(addDays(s,i))); });
  const orphanDates = Object.keys(store.customEvents).filter(d=>!coveredDates.has(d)).sort();
  const orphanCard = orphanDates.length ? `<div class="card week-card">
      <div class="week-card-head"><span class="wb">Outside term dates</span></div>
      <ul>${orphanDates.map(dateISO=>{
        const custom = store.customEvents[dateISO]||[];
        const items = custom.map((c,idx)=>`<span class="custom-event-tag">${escapeHtml(c)} <a href="#" class="cal-del-event" data-date="${dateISO}" data-idx="${idx}" title="Remove this">×</a></span>`).join(' · ');
        return `<li><strong>${fmtLong(fromISO(dateISO))}:</strong> ${items}</li>`;
      }).join('')}</ul>
    </div>` : '';

  return `
    <div class="page-head">
      <p class="page-eyebrow">2026–27</p>
      <h1 class="page-title">Termly Calendar</h1>
    </div>
    <p class="empty-note" style="margin-top:-14px;margin-bottom:18px;">Read directly off the actual Mon–Fri columns in your CPD calendar. Grey/gold tags are the calendar's SESI and ARR columns, which the source doesn't pin to a specific day.</p>
    <div class="card settings-block" style="margin-bottom:20px;">
      <h3 style="margin-top:0;">Add an event</h3>
      <div class="row-flex">
        <input type="date" class="input" id="cal-add-date" style="width:auto;" value="${todayISO}">
        <input type="text" class="input" id="cal-add-text" style="flex:1;min-width:180px;" placeholder="e.g. Parents' evening prep, dentist 2pm…">
        <button class="btn btn-primary" id="cal-add-btn">Add</button>
      </div>
    </div>
    <div class="term-controls">
      <button class="btn btn-sm" id="cal-today">Jump to current week</button>
    </div>
    <div id="cal-list">${cards}${orphanCard}</div>
  `;
}

/* ======================================================================
   LESSON MODAL
   ====================================================================== */
function openLessonModal(dateISO, periodKey){
  // If the clicked period is the second half of a merged double, resolve to
  // the lead period so both halves always open/edit the same lesson.
  const asSecondOf = DOUBLE_PAIRS.find(([a,b])=>b===periodKey);
  if(asSecondOf){
    const leadSlot = getSlotForDate(dateISO, asSecondOf[0]);
    const thisSlot = getSlotForDate(dateISO, periodKey);
    if(isDoubleSlots(leadSlot, thisSlot)){
      periodKey = asSecondOf[0];
    }
  }
  const date = fromISO(dateISO);
  const rows = computeDayRows(dateISO);
  const row = rows.find(r => (r.type==='double' && r.periodA.key===periodKey) || (r.type==='single' && r.period.key===periodKey));
  const isDouble = row && row.type==='double';
  const partnerKey = isDouble ? row.periodB.key : null;
  const label = row ? (isDouble ? row.label : row.period.label) : (PERIODS.find(p=>p.key===periodKey)||{}).label;
  const time = row ? (isDouble ? row.time : row.period.time) : '';
  const slot = getSlotForDate(dateISO, periodKey);
  const info = slot ? classInfo(slot.class) : null;
  const lesson = getLesson(dateISO, periodKey);
  const overridden = isDouble ? (hasDailyOverride(dateISO, periodKey) || hasDailyOverride(dateISO, partnerKey)) : hasDailyOverride(dateISO, periodKey);

  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal">
        <div class="modal-head">
          <div>
            <h3>${info? escapeHtml(info.label) : 'Free period'}</h3>
            <div class="sub">${fmtLong(date)} · ${label} (${time})</div>
          </div>
          <button class="icon-btn" id="modal-close">${ICONS.close}</button>
        </div>
        <div class="field-group" style="display:flex;gap:10px;">
          <div style="flex:1;">
            <label class="field-label">Class code</label>
            <input class="input" id="m-class" value="${escapeHtml(slot? slot.class:'')}" placeholder="e.g. 13A/Ma">
          </div>
          <div style="width:110px;">
            <label class="field-label">Room</label>
            <input class="input" id="m-room" value="${escapeHtml(slot? slot.room:'')}" placeholder="e.g. D2">
          </div>
        </div>
        ${overridden? `<p class="empty-note" style="margin:-8px 0 14px;">Changed just for this date. <a href="#" id="m-reset-slot" style="color:var(--forest);">Reset to normal timetable</a></p>` : ''}
        <div class="field-group">
          <label class="field-label">Lesson focus / title</label>
          <input class="input" id="m-title" value="${escapeHtml(lesson.title)}" placeholder="e.g. Trig identities — proof">
        </div>
        <div class="field-group">
          <label class="field-label">Notes / activities</label>
          <textarea class="input" id="m-notes" rows="4" placeholder="Key activities, resources, differentiation…">${escapeHtml(lesson.notes)}</textarea>
        </div>
        <div class="field-group">
          <label class="field-label">Homework / follow-up</label>
          <input class="input" id="m-hw" value="${escapeHtml(lesson.homework)}" placeholder="Set, due date…">
        </div>
        <div class="modal-actions">
          <button class="btn btn-ghost" id="modal-open-day">Open full day view</button>
          <button class="btn btn-primary" id="modal-save">Save</button>
        </div>
      </div>
    </div>
  `;
  const close = ()=>{ root.innerHTML=''; };
  document.getElementById('modal-close').onclick = close;
  document.getElementById('modal-overlay').addEventListener('click', e=>{ if(e.target.id==='modal-overlay') close(); });
  const resetLink = document.getElementById('m-reset-slot');
  if(resetLink) resetLink.onclick = (e)=>{
    e.preventDefault();
    if(isDouble) clearDailyOverridePair(dateISO, periodKey, partnerKey);
    else clearDailyOverride(dateISO, periodKey);
    openLessonModal(dateISO, periodKey);
  };
  document.getElementById('modal-save').onclick = ()=>{
    const newClass = document.getElementById('m-class').value.trim();
    const newRoom = document.getElementById('m-room').value.trim();
    const baseline = (()=>{ const d=dayKeyOf(date); return d? getSlot(weekTypeFor(date), d, periodKey) : null; })();
    const baselineClass = baseline? baseline.class : '';
    const baselineRoom = baseline? baseline.room : '';
    if(newClass!==baselineClass || newRoom!==baselineRoom){
      if(isDouble) setDailyOverridePair(dateISO, periodKey, partnerKey, newClass, newRoom, time);
      else setDailyOverride(dateISO, periodKey, newClass, newRoom);
    }else if(overridden){
      if(isDouble) clearDailyOverridePair(dateISO, periodKey, partnerKey);
      else clearDailyOverride(dateISO, periodKey);
    }
    setLesson(dateISO, periodKey, {
      title: document.getElementById('m-title').value,
      notes: document.getElementById('m-notes').value,
      homework: document.getElementById('m-hw').value
    });
    showToast('Lesson saved');
    close();
    render();
  };
  document.getElementById('modal-open-day').onclick = ()=>{
    close();
    state.dailyDate = date;
    navigate('daily');
  };
}

const SETUP_SLOTS = [['reg','Registration'],['p1','Period 1'],['p2','Period 2'],['p3','Period 3'],['p4','Period 4'],['p5','Period 5'],['p6','Period 6']];
const CLASS_COLOURS = ['forest','gold','brick','slate','teal','navy','plum','rust','olive','clay','berry'];
let setupDraft = null;
let setupUi = {week:'A', day:'Mon', editing:false, error:''};

function uid(){ return 'c'+Math.random().toString(36).slice(2,9); }
function cap(w){ return w.charAt(0).toUpperCase()+w.slice(1); }

function newSetupDraft(){
  const p = store.profile;
  const d = {
    name: p ? (p.name||'') : '',
    classes: [], grid:{A:{},B:{}},
    sameBothWeeks:false, mergeDoubles:true,
    cd:{enabled:false, label:'End of school year countdown', date:SCHOOL_YEAR_END, excludeEarly:false, cutoff:EARLY_LEAVERS_CUTOFF}
  };
  DAYS.forEach(day=>{ d.grid.A[day]={}; d.grid.B[day]={}; });
  if(p && p.setupDone){
    // Pre-fill from what is in use right now so re-running setup loses nothing.
    const idByCode = {};
    allClassCodes().forEach(code=>{
      const i = classInfo(code), id = uid();
      idByCode[code] = id;
      d.classes.push({id, code, label:i.label, color:i.color});
    });
    ['A','B'].forEach(w=>DAYS.forEach(day=>SETUP_SLOTS.forEach(([k])=>{
      const sl = getSlot(w,day,k);
      if(sl && sl.class) d.grid[w][day][k] = {cls:idByCode[sl.class]||'', room:sl.room||'', dbl:!!sl.double};
    })));
    if(p.countdown) d.cd = Object.assign({}, d.cd, p.countdown);
    d.mergeDoubles = false; // keep exactly the doubles already in use (carried per cell as `dbl`)
  }else{
    d.classes.push({id:uid(), code:'', label:'', color:CLASS_COLOURS[0]});
  }
  return d;
}

function renderSetup(){

function setupRefresh(...ids){
  const map = {classes:setupClassesHtml, timetable:setupTimetableHtml, countdown:setupCountdownHtml};
  ids.forEach(id=>{ const el=document.getElementById('sec-'+id); if(el) el.innerHTML = map[id](); });
}
function finishSetup(){
  const d = setupDraft;
  const classes = d.classes.filter(c=>c.code.trim());
  const lower = classes.map(c=>c.code.trim().toLowerCase());
  const fail = msg=>{ setupUi.error = msg; render(); const e=document.getElementById('setup-err'); if(e) e.scrollIntoView({block:'center'}); };
  if(new Set(lower).size !== lower.length) return fail('Two classes have the same code — please make each one different.');
  if(d.cd.enabled && !d.cd.date) return fail('Please choose a date for the countdown, or switch it off.');
  const codeById = {};
  classes.forEach(c=>codeById[c.id] = c.code.trim());
  const buildWeek = w=>{
    const out = {};
    DAYS.forEach(day=>{
      out[day] = {};
      SETUP_SLOTS.forEach(([k])=>{
        const cell = d.grid[w][day] && d.grid[w][day][k];
        out[day][k] = (cell && codeById[cell.cls]) ? {class:codeById[cell.cls], room:(cell.room||'').trim()} : null;
      });
      {
        DOUBLE_PAIRS.forEach(([a,b])=>{
          const x = out[day][a], y = out[day][b];
          const cx = d.grid[w][day][a], cy = d.grid[w][day][b];
          const carried = !!(cx && cy && cx.dbl && cy.dbl);
          if(x && y && x.class===y.class && x.room===y.room && (d.mergeDoubles || carried)){ x.double = true; y.double = true; }
        });
      }
    });
    return out;
  };
  const A = buildWeek('A');
  const B = d.sameBothWeeks ? JSON.parse(JSON.stringify(A)) : buildWeek('B');
  const meta = {};
  classes.forEach(c=>{ meta[c.code.trim()] = {label:(c.label||'').trim() || c.code.trim(), color:c.color}; });
  store.profile = {
    setupDone:true, kind:'custom', name:d.name.trim(),
    countdown:{enabled:d.cd.enabled, label:(d.cd.label||'').trim() || 'End of school year countdown', date:d.cd.date, excludeEarly:d.cd.excludeEarly, cutoff:d.cd.cutoff}
  };
  store.customTimetable = {A, B};
  store.classMeta = meta;
  store.timetableOverrides = {};
  persist();
  setupDraft = null; setupUi = {week:'A', day:'Mon', editing:false, error:''};
  state.route = 'dashboard';
  render();
  window.scrollTo(0,0);
  showToast('Your planner is ready');
}
let setupHandlersInstalled = false;
function attachSetupHandlers(){
  if(setupHandlersInstalled) return;
  setupHandlersInstalled = true;
  const main = document.getElementById('main');
  const on = (type, fn)=>main.addEventListener(type, e=>{ if(state.route==='setup' && setupDraft) fn(e); });
  on('click', e=>{
    const t = e.target.closest('button'); if(!t) return;
    const d = setupDraft;
    if(t.dataset.act==='add-class'){
      const used = new Set(d.classes.map(c=>c.color));
      const color = CLASS_COLOURS.find(c=>!used.has(c)) || CLASS_COLOURS[d.classes.length % CLASS_COLOURS.length];
      d.classes.push({id:uid(), code:'', label:'', color});
      setupRefresh('classes');
      const rows = document.querySelectorAll('.setup-class-row .sc-code');
      if(rows.length) rows[rows.length-1].focus();
    }else if(t.classList.contains('sc-del')){
      const id = t.closest('.setup-class-row').dataset.cid;
      d.classes = d.classes.filter(c=>c.id!==id);
      ['A','B'].forEach(w=>DAYS.forEach(day=>Object.keys(d.grid[w][day]||{}).forEach(k=>{ if(d.grid[w][day][k].cls===id) d.grid[w][day][k].cls=''; })));
      setupRefresh('classes','timetable');
    }else if(t.dataset.week){
      setupUi.week = t.dataset.week; setupRefresh('timetable');
    }else if(t.dataset.day){
      setupUi.day = t.dataset.day; setupRefresh('timetable');
    }else if(t.dataset.act==='copy-ab'){
      d.grid.B = JSON.parse(JSON.stringify(d.grid.A)); setupUi.week='B'; setupRefresh('timetable'); showToast('Copied Week A into Week B');
    }else if(t.dataset.act==='finish'){
      setupUi.error=''; finishSetup();
    }else if(t.dataset.act==='cancel'){
      setupDraft = null; setupUi.error=''; setupUi.editing=false; navigate('settings');
    }else if(t.dataset.act==='google'){
      driveSignIn();
    }
  });
  on('input', e=>{
    const t = e.target, d = setupDraft;
    const row = t.closest('.setup-class-row');
    if(t.id==='su-name') d.name = t.value;
    else if(row && t.classList.contains('sc-code')) d.classes.find(c=>c.id===row.dataset.cid).code = t.value;
    else if(row && t.classList.contains('sc-label')) d.classes.find(c=>c.id===row.dataset.cid).label = t.value;
    else if(t.classList.contains('st-room')){
      const w = d.sameBothWeeks ? 'A' : setupUi.week;
      const cells = d.grid[w][setupUi.day]; if(!cells[t.dataset.key]) cells[t.dataset.key] = {cls:'', room:''};
      cells[t.dataset.key].room = t.value; cells[t.dataset.key].dbl = false;
    }
    else if(t.id==='cd-label') d.cd.label = t.value;
    else if(t.id==='cd-date') d.cd.date = t.value;
    else if(t.id==='cd-cutoff') d.cd.cutoff = t.value;
  });
  on('change', e=>{
    const t = e.target, d = setupDraft;
    const row = t.closest('.setup-class-row');
    if(row && (t.classList.contains('sc-code') || t.classList.contains('sc-label'))) setupRefresh('timetable');
    else if(row && t.classList.contains('sc-colour')) d.classes.find(c=>c.id===row.dataset.cid).color = t.value;
    else if(t.classList.contains('st-cls')){
      const w = d.sameBothWeeks ? 'A' : setupUi.week;
      const cells = d.grid[w][setupUi.day]; if(!cells[t.dataset.key]) cells[t.dataset.key] = {cls:'', room:''};
      cells[t.dataset.key].cls = t.value; cells[t.dataset.key].dbl = false;
    }
    else if(t.id==='su-same'){ d.sameBothWeeks = t.checked; setupRefresh('timetable'); }
    else if(t.id==='su-merge') d.mergeDoubles = t.checked;
    else if(t.id==='cd-enabled'){ d.cd.enabled = t.checked; setupRefresh('countdown'); }
    else if(t.id==='cd-early'){ d.cd.excludeEarly = t.checked; setupRefresh('countdown'); }
  });
}

        el.addEventListener('input', ()=>{ setHomework(state.hwWeek, el.dataset.class, el.dataset.day, el.value.trim()); save(); });
      });
      document.getElementById('hw-copy').onclick = ()=>{
        const from = state.hwWeek, to = from==='A'?'B':'A';
        if(Object.keys(store.homework[to]).length && !confirm(`Replace everything in Week ${to} with Week ${from}?`)) return;
        store.homework[to] = JSON.parse(JSON.stringify(store.homework[from]));
        persist();
        showToast(`Copied Week ${from} to Week ${to}`);
      };
    }else{
      document.getElementById('hw-prev').onclick = ()=>{ state.hwMonday = addDays(state.hwMonday,-7); render(); };
      document.getElementById('hw-next').onclick = ()=>{ state.hwMonday = addDays(state.hwMonday,7); render(); };
      document.getElementById('hw-today').onclick = ()=>{ state.hwMonday = getMonday(new Date()); render(); };
      const refreshSummary = ()=>{ const el = document.getElementById('hw-summary'); if(el) el.textContent = hwSummaryText(state.hwMonday); };
      document.querySelectorAll('.hw-slot').forEach(cell=>{
        const iso = cell.dataset.iso, code = cell.dataset.class;
        const box = cell.querySelector('.hw-content');
        box.addEventListener('input', debounce(()=>{ setHwWork(iso, code, {content: box.value.trim()}); persist(); }, 400));
        cell.querySelectorAll('.hw-tick input').forEach(cb=>{
          cb.addEventListener('change', ()=>{
            setHwWork(iso, code, {[cb.dataset.field]: cb.checked});
            persist();
            const wk = getHwWork(iso, code);
            cell.classList.toggle('hw-done', wk.created && wk.smhw);
            refreshSummary();
          });
        });
      });
    }
  }

  if(state.route==='plans'){
    document.querySelectorAll('.class-tab').forEach(el=>{
      el.addEventListener('click', ()=>{ state.planClass = el.dataset.class; render(); });
    });
    const labelInput = document.getElementById('class-label-input');
    if(labelInput){
      labelInput.addEventListener('input', debounce(()=>{
        const code = state.planClass;
        const base = classInfo(code);
        store.classMeta[code] = Object.assign({}, base, {label: labelInput.value});
        persist();
      }, 400));
    }
    document.querySelectorAll('.plan-field').forEach(el=>{
      el.addEventListener('input', debounce(()=>{
        const code = state.planClass;
        const half = el.dataset.half;
        if(!store.longTermPlans[code]) store.longTermPlans[code] = {};
        store.longTermPlans[code][half] = el.value;
        persist();
      }, 400));
    });
  }

  if(state.route==='settings'){
    document.querySelectorAll('[data-theme-key]').forEach(el=>{
      el.addEventListener('click', ()=>{ store.theme = el.dataset.themeKey; persist(); render(); });
    });
    document.getElementById('export-btn').onclick = exportData;
    document.getElementById('import-file').onchange = importData;
    document.getElementById('open-setup-btn').onclick = ()=>{ setupDraft = null; setupUi.editing = true; navigate('setup'); };
    document.getElementById('reset-btn').onclick = ()=>{
      if(confirm('This will permanently erase all saved lesson notes, plans and timetable edits from this browser. Continue?')){
        store = defaultStore();
        try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
        setupDraft = null; setupUi.editing = false;
        showToast('All data reset.');
        navigate('dashboard');
      }
    };
    const signinBtn = document.getElementById('drive-signin-btn');
    if(signinBtn) signinBtn.onclick = driveSignIn;
    const syncBtn = document.getElementById('drive-sync-btn');
    if(syncBtn) syncBtn.onclick = ()=>driveSyncNow(false);
    const signoutBtn = document.getElementById('drive-signout-btn');
    if(signoutBtn) signoutBtn.onclick = driveSignOut;
  }
}

function saveTimetableEdits(){
  document.querySelectorAll('[data-edit-day]').forEach(cell=>{
    const day = cell.dataset.editDay, periodKey = cell.dataset.editPeriod;
    const cls = cell.querySelector('.edit-class').value.trim();
    const room = cell.querySelector('.edit-room').value.trim();
    const wType = weekTypeFor(state.weekViewMonday);
    if(!store.timetableOverrides[wType]) store.timetableOverrides[wType] = {};
    if(!store.timetableOverrides[wType][day]) store.timetableOverrides[wType][day] = {};
    if(!cls && !room){
      store.timetableOverrides[wType][day][periodKey] = null;
    }else{
      store.timetableOverrides[wType][day][periodKey] = {class: cls, room: room};
    }
  });
  const wTypeAct = weekTypeFor(state.weekViewMonday);
  document.querySelectorAll('[data-act-day]').forEach(el=>{
    setTemplateActivity(wTypeAct, el.dataset.actDay, el.dataset.actSlot, el.querySelector('.act-type').value, el.querySelector('.act-text').value.trim());
  });
  persist();
  showToast('Timetable updated');
}

/* ======================================================================
   EXPORT / IMPORT
   ====================================================================== */
function exportData(){
  const blob = new Blob([JSON.stringify(store, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `lesson-planner-backup-${toISO(new Date())}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Backup downloaded');
}
function importData(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      if(!confirm('Import this backup? It will replace all data currently saved in this browser.')) return;
      store = normalizeStore(parsed);
      persist();
      showToast('Backup imported');
      navigate('dashboard');
    }catch(err){
      alert('That file could not be read as a planner backup.');
    }
  };
  reader.readAsText(file);
}

/* ======================================================================
   AUTO-HIDING NAV — hides the sidebar / top bar on scroll-down, reveals
   it again on scroll-up (or via the small reveal button), so the content
   area gets more room while reading a long page.
   ====================================================================== */
(function initAutoHideNav(){
  function currentY(){
    return window.scrollY || document.documentElement.scrollTop || document.body.scrollTop || 0;
  }
  let lastY = currentY();
  const THRESHOLD = 10;   // ignore tiny scroll jitter
  const TOP_ZONE = 60;    // always show near the very top of the page
  function onScroll(){
    const y = currentY();
    if(y < TOP_ZONE){
      document.body.classList.remove('nav-hidden');
    }else if(y - lastY > THRESHOLD){
      document.body.classList.add('nav-hidden');
    }else if(lastY - y > THRESHOLD){
      document.body.classList.remove('nav-hidden');
    }
    lastY = y;
  }
  window.addEventListener('scroll', onScroll, {passive:true});
  document.addEventListener('scroll', onScroll, {passive:true});
  document.getElementById('nav-reveal').addEventListener('click', ()=>{
    document.body.classList.remove('nav-hidden');
  });
})();

/* ======================================================================
   GOOGLE DRIVE SYNC
   Saves the planner's data as one JSON file in the signed-in user's own
   Google Drive (created and owned by them — this app can only see the
   one file it creates, nothing else in their Drive).
   ====================================================================== */
const GOOGLE_CLIENT_ID = '906248134114-q0kkee9cntkjttl9laickus81s4reaf4.apps.googleusercontent.com';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
const DRIVE_FILENAME = 'lesson-planner-data.json';
const DRIVE_LEGACY_FILENAME = 'andy-brooks-planner-data.json'; // files created before the planner was shared

let gTokenClient = null;
let gAccessToken = null;
let driveFileId = localStorage.getItem('plannerDriveFileId') || null;
let driveSignedIn = false;
let driveEmail = localStorage.getItem('plannerDriveEmail') || '';
let driveBusy = false;

function waitForGoogleIdentity(cb, tries){
  tries = tries||0;
  if(window.google && google.accounts && google.accounts.oauth2){ cb(); return; }
  if(tries>75){ console.warn('Google Identity Services did not load.'); return; }
  setTimeout(()=>waitForGoogleIdentity(cb, tries+1), 200);
}

function driveInit(){
  waitForGoogleIdentity(()=>{
    gTokenClient = google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID,
      scope: DRIVE_SCOPE,
      callback: (resp)=>{
        driveBusy = false;
        if(resp.error){
          driveSignedIn = false;
          if(state.route==='settings' || state.route==='setup') render();
          return;
        }
        gAccessToken = resp.access_token;
        driveSignedIn = true;
        localStorage.setItem('plannerDriveConnected','1');
        fetchDriveProfile().then(()=>driveSyncNow(true));
      }
    });
    if(localStorage.getItem('plannerDriveConnected')==='1'){
      driveBusy = true;
      gTokenClient.requestAccessToken({prompt:''});
    }
  });
}
function driveSignIn(){
  if(!gTokenClient){ showToast('Still loading Google sign-in — try again in a moment.'); return; }
  driveBusy = true;
  gTokenClient.requestAccessToken({prompt:'consent'});
  if(state.route==='settings' || state.route==='setup') render();
}
function driveSignOut(){
  if(gAccessToken) google.accounts.oauth2.revoke(gAccessToken, ()=>{});
  driveSignedIn = false; gAccessToken = null; driveEmail='';
  localStorage.removeItem('plannerDriveConnected');
  localStorage.removeItem('plannerDriveEmail');
  showToast('Disconnected from Google Drive');
  if(state.route==='settings' || state.route==='setup') render();
}
async function fetchDriveProfile(){
  try{
    const res = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {headers:{'Authorization':'Bearer '+gAccessToken}});
    const data = await res.json();
    driveEmail = data.email || '';
    localStorage.setItem('plannerDriveEmail', driveEmail);
  }catch(e){ /* non-essential */ }
}
function driveHeaders(extra){
  return Object.assign({'Authorization':'Bearer '+gAccessToken}, extra||{});
}
async function driveFindFile(){
  for(const name of [DRIVE_FILENAME, DRIVE_LEGACY_FILENAME]){
    const q = encodeURIComponent(`name='${name}' and trashed=false`);
    const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,name)`, {headers:driveHeaders()});
    const data = await res.json();
    if(data.files && data.files.length){
      driveFileId = data.files[0].id;
      localStorage.setItem('plannerDriveFileId', driveFileId);
      return driveFileId;
    }
  }
  return null;
}
async function driveCreateFile(content){
  const boundary = 'plannerBoundary';
  const metadata = {name: DRIVE_FILENAME, mimeType:'application/json'};
  const body =
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n`+
    `--${boundary}\r\nContent-Type: application/json\r\n\r\n${content}\r\n`+
    `--${boundary}--`;
  const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
    method:'POST',
    headers: driveHeaders({'Content-Type':`multipart/related; boundary=${boundary}`}),
    body
  });
  const data = await res.json();
  driveFileId = data.id;
  localStorage.setItem('plannerDriveFileId', driveFileId);
}
async function driveUpload(content){
  if(!driveFileId){
    const found = await driveFindFile();
    if(!found){ await driveCreateFile(content); return; }
  }
  const res = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=media`, {
    method:'PATCH',
    headers: driveHeaders({'Content-Type':'application/json'}),
    body: content
  });
  if(res.status===404){ driveFileId=null; localStorage.removeItem('plannerDriveFileId'); await driveCreateFile(content); }
}
async function driveDownload(){
  if(!driveFileId){
    const found = await driveFindFile();
    if(!found) return null;
  }
  const res = await fetch(`https://www.googleapis.com/drive/v3/files/${driveFileId}?alt=media`, {headers:driveHeaders()});
  if(!res.ok) return null;
  return await res.text();
}
async function driveSyncNow(silent){
  if(!gAccessToken){ if(!silent) showToast('Not signed in to Google.'); return; }
  driveBusy = true;
  if(state.route==='settings' || state.route==='setup') render();
  try{
    const remoteText = await driveDownload();
    if(remoteText){
      const remote = JSON.parse(remoteText);
      const remoteTime = remote.lastModified||0;
      const localTime = store.lastModified||0;
      if(remoteTime > localTime){
        store = normalizeStore(remote);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
        showToast('Loaded the latest version from Google Drive');
        render();
      }else if(localTime > remoteTime && !needsSetup()){
        await driveUpload(JSON.stringify(store));
        showToast('Backed up to Google Drive');
      }else if(!silent){
        showToast('Already up to date');
      }
    }else if(!needsSetup()){
      await driveUpload(JSON.stringify(store));
      showToast('Backed up to Google Drive');
    }else if(!silent){
      showToast('No saved planner found in this Google account yet — fill in the setup below.');
    }
  }catch(err){
    console.error(err);
    if(!silent) showToast('Drive sync failed — check your connection and try again.');
  }
  driveBusy = false;
  if(state.route==='settings' || state.route==='setup') render();
}

/* ======================================================================
   INIT
   ====================================================================== */
render();
driveInit();
</script>
